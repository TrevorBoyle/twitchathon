function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function isConfusing(name){ return CONFIG.confusingKeywords.some(function(k){ return name.indexOf(k)>=0; }); }

function minuteOfDay(clock){ return (270 + clock) % 1440; }
/* Smallest absolute clock value at or after afterClock whose minuteOfDay
   equals targetMinuteOfDay — used to turn a fixed wake-up time (4am, 5am,
   6am) into an actual clock value regardless of what time camp happened
   to finish being made. */
function nextOccurrenceOfMinuteOfDay(afterClock, targetMinuteOfDay){
  var clock = targetMinuteOfDay - 270;
  while(clock < afterClock) clock += 1440;
  return clock;
}
/* The clock value the current day's hard cutoff lands on — midnight
   (auto-camp) on Saturday, 3pm (auto end-game) on Sunday. */
function cutoffClock(){
  if(state.day==="Saturday") return CONFIG.saturdayEnd;
  if(state.day==="Sunday") return CONFIG.deadline;
  return Infinity;
}
/* Human-readable name for whichever cutoff is currently live, used in
   button captions and log lines instead of hard-coding "midnight"
   everywhere now that this same check also guards the Sunday deadline. */
function cutoffLabel(){
  return state.day==="Sunday" ? "the deadline" : "midnight";
}
/* Would committing to `minutes` of walking/watching/driving right now run
   past today's cutoff — midnight on Saturday, the 3pm deadline on Sunday?
   Used to keep an action from ever being started if it can't be finished
   before camp is forced (Saturday) or the weekend is simply over (Sunday). */
function wouldCrossCutoff(minutes){
  return (state.clock + minutes) > cutoffClock();
}

/* True once at least one of the actions actually on offer right now — the
   loop/hide options and zone changes at this site, or any direct drive out
   of it — would run past today's cutoff. Drives the pulse on "Make camp"
   (Saturday) / "Call it a weekend" (Sunday): the first time something you
   could otherwise do gets greyed out for running too late is exactly the
   moment that nudge is useful, rather than waiting until every last option
   is blocked and the auto-transition is about to fire anyway. */
function cutoffLooming(){
  if(state.phase!=="play" || state.ambiguous || state.ended) return false;
  if(state.day!=="Saturday" && state.day!=="Sunday") return false;
  var times = [];
  var base = SITES[state.currentSite];
  if(base.zones){
    base.zones.forEach(function(z){ if(z.id!==state.currentZone) times.push(20); });
  }
  var site = activeSite();
  if(site.hide) times.push(CONFIG.hideSearch.minutes);
  getLoopOptions(site).forEach(function(k){ times.push(CONFIG.loop[k].minutes); });
  var travelTable = state.travel[state.currentSite] || {};
  Object.keys(travelTable).forEach(function(id2){ times.push(travelTable[id2]); });
  return times.some(function(m){ return wouldCrossCutoff(m); });
}
function windowIndex(clock){
  var m = minuteOfDay(clock);
  if(m>=270 && m<330) return 0;
  if(m>=330 && m<450) return 1;
  if(m>=450 && m<630) return 2;
  if(m>=630 && m<840) return 3;
  if(m>=840 && m<1020) return 4;
  if(m>=1020 && m<1140) return 5;
  if(m>=1140 && m<1260) return 6;
  return 7;
}
function fmtClock(clock){
  var dayIdx = Math.floor((270+clock)/1440);
  var m = minuteOfDay(clock);
  var h24 = Math.floor(m/60), min = m%60;
  var ampm = h24>=12 ? "pm" : "am";
  var h12 = h24%12; if(h12===0) h12=12;
  var dayName = dayIdx===0 ? "Sat" : "Sun";
  return dayName + " " + h12 + ":" + (min<10?"0":"")+min + ampm;
}
/* Human-readable span for event durations in log messages — "45 minutes",
   "1 hour", "8 hours" — so every timed effect can state exactly how long
   it lasts instead of leaving the player to guess. */
function fmtDuration(min){
  min = Math.round(min);
  if(min < 60) return min + " minute" + (min===1?"":"s");
  var h = min/60;
  if(h % 1 === 0) return h + " hour" + (h===1?"":"s");
  return (Math.round(h*10)/10) + " hours";
}
function energyTier(e){
  for(var i=0;i<CONFIG.energyTiers.length;i++){ if(e >= CONFIG.energyTiers[i].min) return CONFIG.energyTiers[i]; }
  return CONFIG.energyTiers[CONFIG.energyTiers.length-1];
}
/* Detection fades the longer you linger at one site, in 15-minute slots
   (the same slot size the watch/search loop already ticks in), decaying
   exponentially rather than dropping in a few harsh steps. Bigger ground
   takes longer to work over, so the decay is gentler at large sites and
   sharper at small pocket ones. */
/* `size` is accepted but no longer used — the decay curve is shared
   across every site now; kept as a parameter so call sites don't need
   updating. */
function timeOnSiteMult(min, size){
  var slot = Math.floor(min / CONFIG.chunkMinutes);
  return Math.max(CONFIG.timeOnSiteFloor, Math.pow(CONFIG.timeOnSiteDecay, slot));
}

/* ============================== ACTIVE SITE (handles zones) ============================== */
function activeSite(){
  var base = SITES[state.currentSite];
  if(base.zones){
    var zid = state.currentZone || base.zones[0].id;
    var z = base.zones.find(function(zz){ return zz.id===zid; }) || base.zones[0];
    return { id: base.id, zoneId: z.id, name: base.name + " — " + z.name, species: z.species, hide:false, size:"large", zone: base.zone, blurb: base.blurb };
  }
  return { id: base.id, zoneId: null, name: base.name, species: base.species, hide: base.hide, size: base.size, zone: base.zone, blurb: base.blurb };
}

function findSpecies(id){
  for(var i=0;i<FLAT_SPECIES.length;i++){ if(FLAT_SPECIES[i].species.id===id) return FLAT_SPECIES[i].species; }
  return null;
}

/* ============================== ENGINE ============================== */
function pruneEffects(){
  state.activeEffects = state.activeEffects.filter(function(e){ return e.expiresAtClock === null || e.expiresAtClock > state.clock; });
}

function getWeatherWaterVisualPenalty(site, species){
  if(state.loadout.weatherproof) return 1;
  var hasMist = state.activeEffects.some(function(e){ return e.type==="mist"; });
  if(hasMist && WET_SITE_IDS[site.id] && species.group==="water" && !species.audio) return CONFIG.effects.mistWaterMult;
  return 1;
}

function siteDistancePenalty(site, species){
  if(state.loadout.scope) return 1;
  if(site.id==="banghamcp" && species.group==="raptor") return CONFIG.effects.distancePenaltyMult;
  if(site.id==="lakeleake" && species.group==="water") return CONFIG.effects.distancePenaltyMult;
  if(site.id==="boollagoon" && species.group==="water") return CONFIG.effects.distancePenaltyMult;
  return 1;
}

function detectionChance(site, species, bonusMult){
  bonusMult = bonusMult || 1;
  var base = ABUNDANCE[species.tier];
  var wIdx = windowIndex(state.clock);
  var todMult = CONFIG.activityMult[species.group][wIdx];
  if(todMult<=0) return 0;
  var weatherMult = state.weatherMult===undefined ? 1 : state.weatherMult;
  if(state.loadout.weatherproof) weatherMult = Math.max(weatherMult, CONFIG.effects.weatherproofFloor);
  weatherMult *= getWeatherWaterVisualPenalty(site, species);
  var spotMult = 1 + state.binocDet/100;
  var eTier = energyTier(state.energy);
  var tosMult = timeOnSiteMult(state.minutesOnSite, site.size);
  var effectMult = 1;
  state.activeEffects.forEach(function(e){
    if(e.type==="dewy") effectMult *= CONFIG.effects.dewyMult;
    if(e.type==="magpie") effectMult *= CONFIG.effects.magpieMult;
    if(e.type==="rareAlert" && e.siteId===site.id && (e.zoneId==null||e.zoneId===site.zoneId) && e.speciesId===species.id) effectMult *= (species.tier==="mega" ? 12 : 3);
    if(e.type==="localTip" && e.siteId===site.id && (e.zoneId==null||e.zoneId===site.zoneId) && e.speciesId===species.id) effectMult *= 2.2;
    if(e.type==="coldFront" && e.siteId===site.id && species.group==="water") effectMult *= CONFIG.effects.coldFrontMult;
    if(e.type==="goldenLight") effectMult *= CONFIG.effects.goldenLightMult;
    if(e.type==="windPickup" && species.group==="bush") effectMult *= CONFIG.effects.windPickupMult;
  });
  if(state.loadout.twitchersNose && (species.tier==="rare"||species.tier==="mega")) effectMult *= CONFIG.twitchersNose.mult;
  if(state.loadout.parabolicMic && species.audio) effectMult *= CONFIG.effects.parabolicMicDetectMult;
  var chance = base * todMult * weatherMult * spotMult * eTier.mult * tosMult * effectMult * bonusMult;
  return Math.min(chance, 0.95);
}

function idChance(species, site, bonus){
  bonus = bonus||0;
  var skillMult = 1 + state.binocId/100;
  var eTier = energyTier(state.energy);
  var fieldGuideMult = (state.loadout.fieldGuide && isConfusing(species.name)) ? CONFIG.effects.fieldGuideMult : 1;
  var distMult = siteDistancePenalty(site, species);
  var scopeMult = (state.loadout.scope && species.group==="raptor") ? CONFIG.effects.scopeRaptorIdMult : 1;
  var micMult = (state.loadout.parabolicMic && species.audio) ? CONFIG.effects.parabolicMicIdMult : 1;
  var gearFumbleMult = state.activeEffects.some(function(e){ return e.type==="gearFumble"; }) ? CONFIG.effects.gearFumbleMult : 1;
  var preDawnMult = (windowIndex(state.clock)===0 && species.group!=="nocturnal") ? CONFIG.effects.preDawnNonNocturnalIdMult : 1;
  var chance = species.idDiff * (1+bonus) * skillMult * eTier.mult * fieldGuideMult * distMult * scopeMult * micMult * gearFumbleMult * preDawnMult;
  return clamp(chance, 0.02, 0.97);
}

/* The loop bonus that will actually apply once a mode is chosen varies by
   site — hide sites always resolve at bonusMult 1, walk sites range from
   0.82x (a quick loop) to 1.32x (the full loop) depending on what that
   site offers (CONFIG.siteLoopOptions). oddsSnapshot below needs *a*
   concrete number before the player has committed to a loop, so it uses
   the average bonus across this site's available loop lengths as a
   baseline — the real number, once a specific loop is chosen in the Watch
   panel, will sit a bit above or below this rather than matching exactly. */
function oddsBonusMultForSite(site){
  if(site.hide) return 1;
  var keys = getLoopOptions(site);
  if(!keys.length) return 1;
  var sum = 0;
  keys.forEach(function(k){ sum += CONFIG.loop[k].bonus; });
  return sum/keys.length;
}

/* ---- live odds estimate for the HUD status bar ----
   Both percentages are averaged across whatever's left to find at this
   site, using the real detectionChance()/idChance() functions, so they're
   always exactly consistent with what play produces. Detect is a plain
   per-species average rather than "chance of at least one of many birds" —
   the latter saturates toward 100% once a site has more than a handful of
   candidates left (multiplying enough (1-chance) terms together drives the
   product toward zero regardless of any single multiplier), which made
   every gear/weather/energy effect invisible on a rich site. Averaging the
   individual per-species chances instead means every purchased bonus
   (optics, twitcher's nose, field guide) and every penalty (weather,
   fatigue, time-on-site decay, distance) moves the number proportionally,
   the way a single multiplier should. Since the loop bonus isn't chosen
   yet, it uses oddsBonusMultForSite()'s average as a stand-in bonusMult —
   see that function's comment for why this is a baseline rather than an
   exact match. The modifier chips are derived from the same
   CONFIG.effects.* values the formulas above use, so they can't drift out
   of sync with the math the way separately-typed percentages could. */
function oddsSnapshot(){
  var site = activeSite();
  var candidates = site.species.filter(function(s){ return !state.confirmedThisVisit[s.id]; });
  if(!candidates.length) return null;

  var eTier = energyTier(state.energy);
  var tosMult = timeOnSiteMult(state.minutesOnSite, site.size);
  var spotMult = 1 + state.binocDet/100;
  var idSkillMult = 1 + state.binocId/100;
  var weatherBase = state.weatherMult===undefined ? 1 : state.weatherMult;
  var hasMist = state.activeEffects.some(function(e){ return e.type==="mist"; });
  var hasDewy = state.activeEffects.some(function(e){ return e.type==="dewy"; });
  var hasMagpie = state.activeEffects.some(function(e){ return e.type==="magpie"; });
  var hasGoldenLight = state.activeEffects.some(function(e){ return e.type==="goldenLight"; });
  var hasWind = state.activeEffects.some(function(e){ return e.type==="windPickup"; });
  var hasGearFumble = state.activeEffects.some(function(e){ return e.type==="gearFumble"; });
  var wetSite = !!WET_SITE_IDS[site.id];
  var anyNonAudioWater = candidates.some(function(s){ return s.group==="water" && !s.audio; });
  var anyRareOrMega = candidates.some(function(s){ return s.tier==="rare"||s.tier==="mega"; });
  var anyConfusing = candidates.some(function(s){ return isConfusing(s.name); });
  var anyAudio = candidates.some(function(s){ return s.audio; });
  var anyRaptor = candidates.some(function(s){ return s.group==="raptor"; });
  var anyBush = candidates.some(function(s){ return s.group==="bush"; });
  var isPreDawn = windowIndex(state.clock)===0;
  var anyNonNocturnal = candidates.some(function(s){ return s.group!=="nocturnal"; });
  var hasCold = state.activeEffects.some(function(e){ return e.type==="coldFront" && e.siteId===site.id; }) && candidates.some(function(s){ return s.group==="water"; });
  var distPenaltyHit = candidates.some(function(s){ return siteDistancePenalty(site, s) < 1; });
  var effectiveWeather = state.loadout.weatherproof ? Math.max(weatherBase, CONFIG.effects.weatherproofFloor) : weatherBase;
  var tipHit = null;
  state.activeEffects.forEach(function(e){
    if((e.type!=="rareAlert" && e.type!=="localTip") || e.siteId!==site.id || (e.zoneId!=null && e.zoneId!==site.zoneId)) return;
    var target = candidates.filter(function(s){ return s.id===e.speciesId; })[0];
    if(!target) return;
    tipHit = { label: (e.type==="rareAlert"?"Tip-off: ":"Local tip: ")+target.name, mult: e.type==="rareAlert" ? (target.tier==="mega"?12:3) : 2.2 };
  });

  var bonusMult = oddsBonusMultForSite(site);
  var detectMissProduct=1, idWeightedSum=0, idWeight=0, idPlainSum=0, n=0;
  candidates.forEach(function(s){
    var d = detectionChance(site, s, bonusMult);
    var i = idChance(s, site, 0);
    detectMissProduct *= (1-d); idPlainSum += i; idWeightedSum += i*d; idWeight += d; n++;
  });
  /* "Detect" is the pooled chance that at least one remaining candidate
     gets detected this chunk — every candidate rolls independently in
     processChunk, so this is 1 minus the chance every single one misses,
     not a plain per-species average (which used to understate how often
     a rich site turns up a flurry in one go). */
  var detectPct = 1 - detectMissProduct;
  var idPct = idWeight>0 ? idWeightedSum/idWeight : idPlainSum/n;

  var detectMods = [];
  if(eTier.mult<1) detectMods.push({ label:"Energy ("+eTier.name+")", pct:(eTier.mult-1)*100 });
  if(spotMult>1) detectMods.push({ label:"Optics", pct:(spotMult-1)*100 });
  if(tosMult<1) detectMods.push({ label:"Time on site", pct:(tosMult-1)*100 });
  if(Math.abs(effectiveWeather-1)>0.001) detectMods.push({ label:"Weather ("+(state.weatherLabel||"")+")", pct:(effectiveWeather-1)*100 });
  if(state.loadout.weatherproof && weatherBase<CONFIG.effects.weatherproofFloor) detectMods.push({ label:"Weatherproofed", pct:(effectiveWeather-weatherBase)*100 });
  if(hasMist && wetSite && anyNonAudioWater && !state.loadout.weatherproof) detectMods.push({ label:"Misty water", pct:(CONFIG.effects.mistWaterMult-1)*100 });
  if(hasDewy) detectMods.push({ label:"Dewy optics", pct:(CONFIG.effects.dewyMult-1)*100 });
  if(hasMagpie) detectMods.push({ label:"Distracted", pct:(CONFIG.effects.magpieMult-1)*100 });
  if(hasGoldenLight) detectMods.push({ label:"Perfect light", pct:(CONFIG.effects.goldenLightMult-1)*100 });
  if(hasWind && anyBush) detectMods.push({ label:"Windy", pct:(CONFIG.effects.windPickupMult-1)*100 });
  if(state.loadout.twitchersNose && anyRareOrMega) detectMods.push({ label:"Twitcher's nose", pct:(CONFIG.twitchersNose.mult-1)*100 });
  if(state.loadout.parabolicMic && anyAudio) detectMods.push({ label:"Parabolic mic", pct:(CONFIG.effects.parabolicMicDetectMult-1)*100 });
  if(hasCold) detectMods.push({ label:"Fallout conditions", pct:(CONFIG.effects.coldFrontMult-1)*100 });
  if(tipHit) detectMods.push({ label:tipHit.label, pct:(tipHit.mult-1)*100 });

  var idMods = [];
  if(idSkillMult>1) idMods.push({ label:"Optics (ID)", pct:(idSkillMult-1)*100 });
  if(eTier.mult<1) idMods.push({ label:"Energy ("+eTier.name+")", pct:(eTier.mult-1)*100 });
  if(state.loadout.fieldGuide && anyConfusing) idMods.push({ label:"Field guide", pct:(CONFIG.effects.fieldGuideMult-1)*100 });
  if(distPenaltyHit) idMods.push({ label:"Distance (no scope)", pct:(CONFIG.effects.distancePenaltyMult-1)*100 });
  if(state.loadout.scope && anyRaptor) idMods.push({ label:"Scope (raptors)", pct:(CONFIG.effects.scopeRaptorIdMult-1)*100 });
  if(state.loadout.parabolicMic && anyAudio) idMods.push({ label:"Parabolic mic (ID)", pct:(CONFIG.effects.parabolicMicIdMult-1)*100 });
  if(hasGearFumble) idMods.push({ label:"Fumbled gear", pct:(CONFIG.effects.gearFumbleMult-1)*100 });
  if(isPreDawn && anyNonNocturnal) idMods.push({ label:"Pre-dawn light", pct:(CONFIG.effects.preDawnNonNocturnalIdMult-1)*100 });

  return { detectPct:detectPct, idPct:idPct, detectMods:detectMods, idMods:idMods };
}

function renderModChips(mods){
  if(!mods.length) return "";
  return mods.map(function(m){
    var sign = m.pct>=0 ? "+" : "";
    var cls = m.pct>=0 ? "mod-pos" : "mod-neg";
    return '<span class="modchip '+cls+'">'+esc(m.label)+' '+sign+Math.round(m.pct)+'%</span>';
  }).join("");
}

function addLog(txt, cls, tier){
  state.log.push({ ts: fmtClock(state.clock), txt: txt, cls: cls||"system", tier: tier||null, clock: state.clock, energy: Math.round(state.energy), species: distinctConfirmedCount() });
}

var CONFIRM_LINES = [
  "{n} — unmistakable, and banked.",
  "Good clean look at {n}. On the list.",
  "{n} confirmed, no argument from anyone.",
  "There's {n} — ticked."
];
var CONFIRM_AUDIO_LINES = [
  "{n} calling, out of sight — heard counts full, and it's banked.",
  "That's {n} by ear. Nobody needed to see it.",
  "{n}, somewhere in the dark — confirmed on call alone."
];
var LOST_LINES = [
  "Something moved — gone before anyone could get on it. No credit.",
  "A flash of wing and it was over. Lost it.",
  "There and gone. Whatever it was, it didn't stick around."
];
var QUIET_LINES = [
  "Fifteen quiet minutes. Nothing new stirred.",
  "Fifteen minutes of the same old regulars.",
  "Not much moving right now."
];
var ALREADY_TICKED_LINES = [
  "Another {n} — already on the list.",
  "{n} again — nothing new there.",
  "Same {n} as before, still nice to see."
];
/* A species you already have from somewhere else on the map, but not yet
   logged at this particular site — worth flagging as different from both
   a genuinely new tick and a bird you've already ticked here before. */
var NEW_LOCATION_LINES = [
  "{n} here too — already on your list, but a first for this spot.",
  "That's {n} again, just not at this site before now.",
  "Good to have {n} confirmed here as well."
];
var NEW_LOCATION_AUDIO_LINES = [
  "{n} calling here too — already on the list, but a first for this location.",
  "{n} again, this time by ear, and a first for this spot."
];

function line(pool, name){ return pick(pool).replace("{n}", "<b>"+name+"</b>"); }

/* Has this species been confirmed anywhere yet, at any site — as opposed
   to state.confirmed[spx.id], which is keyed per site and only tells you
   whether THIS site's entry has been ticked before. */
function isNameAlreadyKnown(name){
  for(var id in state.confirmed){ if(state.confirmed[id].name===name) return true; }
  return false;
}

function addToLifeList(spx, site){
  if(state.confirmed[spx.id]) {
    state.confirmedThisVisit[spx.id]=true;
    addLog(line(ALREADY_TICKED_LINES, spx.name), "system");
    return;
  }
  var knownElsewhere = isNameAlreadyKnown(spx.name);
  /* A life tick only means something once there's a real "previous games"
     to compare against, and only the first time this species is confirmed
     this game (not a second site producing the same name). */
  var isLifeTick = !knownElsewhere && GAMES_PLAYED_BEFORE>0 && !LIFE_LIST_SNAPSHOT[spx.name];
  if(!LIFE_LIST_SNAPSHOT[spx.name]){
    LIFE_LIST_SNAPSHOT[spx.name] = todayISODate();
    saveLifeListStore(LIFE_LIST_SNAPSHOT);
  }
  state.confirmed[spx.id] = { name: spx.name, tier: spx.tier, siteId: site.id, siteName: site.name, at: fmtClock(state.clock), audio: spx.audio, firstSeenDate: LIFE_LIST_SNAPSHOT[spx.name] };
  state.confirmedThisVisit[spx.id] = true;
  var tierTag = spx.tier==="mega" ? "  <span class='pill mega'>mega</span>" : (spx.tier==="rare" ? "  <span class='pill rare'>rare</span>" : "");
  var lifeTickTag = isLifeTick ? "  <span class='pill life-tick'>life tick</span>" : "";
  if(knownElsewhere){
    addLog(line(spx.audio?NEW_LOCATION_AUDIO_LINES:NEW_LOCATION_LINES, spx.name) + tierTag, "newlocation", spx.tier);
  } else {
    addLog(line(spx.audio?CONFIRM_AUDIO_LINES:CONFIRM_LINES, spx.name) + tierTag + lifeTickTag, "encounter", spx.tier);
  }
}

function handleDetection(site, spx, allowAmbiguous){
  if(allowAmbiguous === undefined) allowAmbiguous = true;
  var luckyIdx = -1;
  for(var i=0;i<state.activeEffects.length;i++){ if(state.activeEffects[i].type==="luckyBreak"){ luckyIdx=i; break; } }
  if(luckyIdx>=0){
    state.activeEffects.splice(luckyIdx,1);
    addToLifeList(spx, site);
    return "confirmed";
  }
  var idc = idChance(spx, site);
  var r = rnd();
  if(r < idc){
    addToLifeList(spx, site);
    return "confirmed";
  }
  var remain = 1-idc;
  /* The "What was that?" chase is only worth the interruption for a bird
     that's actually new information — something never confirmed anywhere
     on the life list yet, or a rare/mega that's worth chasing down
     regardless. A missed ID on a bird you already know just reads as
     lost; no chase offered. */
  var worthChasing = !isNameAlreadyKnown(spx.name) || spx.tier==="rare" || spx.tier==="mega";
  if(allowAmbiguous && worthChasing && r < idc + remain*0.33){
    state.ambiguous = { siteId: site.id, zoneId: site.zoneId, speciesId: spx.id, attempts: 0 };
    /* Keep Searching is disabled on the ambiguous panel once you're
       Cooked (see renderAmbiguousPanel) — so the log line shouldn't
       promise a chase you can't actually take right this second. */
    var tooCookedToChase = energyTier(state.energy).name==="Cooked";
    addLog(tooCookedToChase
      ? "Something stirs in the cover, but you're too worn out to chase it down right now."
      : "Something calls from cover, but nobody can place it yet.", "system");
    return "ambiguous";
  }
  return "lost";
}

function processChunk(mode, bonusMult, chunkIndex){
  bonusMult = bonusMult || 1;
  chunkIndex = chunkIndex || 0;
  var site = activeSite();
  var chunkStart = state.clock;
  state.clock += CONFIG.chunkMinutes;
  var chunkEnd = state.clock;
  state.minutesOnSite += CONFIG.chunkMinutes;
  var rate = mode==="hide" ? CONFIG.energyRates.hide : CONFIG.energyRates.walk;
  /* Fatigue ramp only bites on foot — chunkIndex counts consecutive
     15-minute chunks of this same committed walk (see startWatch). */
  var fatigueRamp = mode==="walk" ? Math.pow(CONFIG.continuousWalkFatigue, chunkIndex) : 1;
  spendEnergy(rate*fatigueRamp*CONFIG.chunkMinutes/60);
  pruneEffects();
  /* Every remaining candidate gets an independent roll this chunk now —
     no flat cap on how many species can be "in play" at once. A rich
     site can genuinely turn up a flurry in one good chunk; ABUNDANCE and
     the time-on-site decay above are what keep that in check instead. */
  var candidates = shuffle(site.species.filter(function(s){
    return !state.confirmedThisVisit[s.id] && (mode!=="hide" || s.group==="water");
  }));
  /* Which of the candidates actually hit this chunk — decided up front,
     before any clock juggling, so the spacing below can lay them out
     across the whole chunk instead of wherever the roll order put them. */
  var hits = candidates.filter(function(s){ return rnd() < detectionChance(site, s, bonusMult); });
  /* Detections within the same 15-minute chunk used to all land on the
     same displayed minute (the chunk's end), then later all bunched up
     one after another right at the start. Spread evenly across the
     chunk instead — still at least a minute apart — so a busy chunk
     reads as a sequence spaced through the quarter-hour rather than a
     pile-up at either end. The real game clock (chunkEnd, used for
     everything else below) is untouched. */
  var hadConfirm=false, hadLost=false, ambigTriggered=false, lastOffset=0;
  for(var i=0;i<hits.length;i++){
    var target = hits.length>1
      ? Math.round(1 + i*(CONFIG.chunkMinutes-2)/(hits.length-1))
      : Math.round(CONFIG.chunkMinutes/2);
    var offset = Math.min(CONFIG.chunkMinutes-1, Math.max(target, lastOffset+1));
    lastOffset = offset;
    state.clock = chunkStart + offset;
    /* An ambiguous call stops this chunk right here — any other hits
       queued up later in the same quarter-hour just get rolled fresh
       next chunk instead (see startWatch's pendingLoop resume), rather
       than resolving as confirmed/lost sightings that would show up in
       the feed chronologically *after* the "what was that?" moment but
       get revealed to the player before it's resolved. Used to let the
       rest of the chunk play out regardless, which read as the game
       skipping ahead to other birds before circling back to ask about
       this one. */
    var outcome = handleDetection(site, hits[i], !ambigTriggered);
    state.clock = chunkEnd;
    if(outcome==="confirmed") hadConfirm=true;
    else if(outcome==="lost") hadLost=true;
    else if(outcome==="ambiguous"){ ambigTriggered=true; break; }
  }
  if(!ambigTriggered){
    if(!hadConfirm && !hadLost) addLog(line(QUIET_LINES), "system");
    else if(!hadConfirm && hadLost) addLog(line(LOST_LINES), "system");
  }
  maybeTriggerEvent();
  simulateRivals(state.clock);
  checkAutoTransitions();
  return ambigTriggered ? "ambiguous" : "ok";
}

function startWatch(mode, minutes, bonusMult, startChunkIndex){
  if(state.ambiguous || state.ended) return;
  state.teaStreak = 0;
  bonusMult = bonusMult || 1;
  var site = activeSite();
  if(mode==="hide" && !site.hide) mode="walk";
  var chunks = Math.round(minutes/CONFIG.chunkMinutes);
  /* Tracks consecutive 15-minute chunks of continuous walking for the
     fatigue ramp in processChunk. Only carried over via startChunkIndex
     when resuming a pendingLoop after an ambiguous chase — any other
     call to startWatch (a fresh loop, after a tea break, snack,
     travel, etc.) starts back at 0. */
  var chunkIndex = startChunkIndex || 0;
  for(var i=0;i<chunks;i++){
    if(state.ended || state.phase!=="play") break;
    if(energyTier(state.energy).name==="Cooked"){
      addLog("Too cooked to keep watching — time for a break.", "system");
      break;
    }
    var outcome = processChunk(mode, bonusMult, chunkIndex);
    chunkIndex++;
    if(outcome==="ambiguous"){
      var remainingChunks = chunks - (i+1);
      if(remainingChunks>0) state.pendingLoop = { mode: mode, bonusMult: bonusMult, minutes: remainingChunks*CONFIG.chunkMinutes, chunkIndex: chunkIndex };
      break;
    }
    if(state.ended || state.phase!=="play") break;
  }
  revealAndRender();
}

function resumePendingLoopOrRender(){
  if(state.pendingLoop && !state.ended && state.phase==="play"){
    var pl = state.pendingLoop;
    state.pendingLoop = null;
    startWatch(pl.mode, pl.minutes, pl.bonusMult, pl.chunkIndex);
  } else {
    revealAndRender();
  }
}

/* Same per-minute cost as walking, just steeper — pinning down an ambiguous
   call takes more out of you than an equivalent stretch of easy walking.
   Rounded up to the nearest whole point so it always reads (and spends)
   as a clean number rather than a fraction. */
function keepLookingEnergyCost(){
  return Math.ceil(CONFIG.energyRates.walk * (CONFIG.keepLookingTime/60) * CONFIG.keepLookingEnergyMult);
}

function resolveKeepLooking(){
  if(!state.ambiguous) return;
  if(energyTier(state.energy).name==="Cooked"){ addLog("Too cooked to keep at it — break first.", "system"); revealAndRender(); return; }
  var amb = state.ambiguous;
  var spx = findSpecies(amb.speciesId);
  var site = activeSite();
  amb.attempts++;
  state.clock += CONFIG.keepLookingTime;
  state.minutesOnSite += CONFIG.keepLookingTime;
  spendEnergy(keepLookingEnergyCost());
  state.teaStreak = 0;
  var idx = Math.min(amb.attempts-1, 2);
  var bonus = CONFIG.keepLooking[idx].bonus;
  var flush = amb.attempts<=3 ? CONFIG.keepLooking[idx].flush : CONFIG.keepLooking[2].flush + 0.08*(amb.attempts-3);
  var resolved = false;
  if(rnd() < flush){
    state.gotAway.push({ siteId: site.id, siteName: site.name, at: fmtClock(state.clock), group: spx.group, audio: spx.audio, speciesId: spx.id, speciesName: spx.name });
    addLog("It's scared off before you can pin it down — one that got away.", "system");
    state.ambiguous = null;
    resolved = true;
  } else if(rnd() < idChance(spx, site, bonus)){
    addToLifeList(spx, site);
    state.ambiguous = null;
    resolved = true;
  } else {
    addLog("Still calling, still not settled. Worth one more look?", "system");
  }
  maybeTriggerEvent();
  simulateRivals(state.clock);
  checkAutoTransitions();
  if(resolved) resumePendingLoopOrRender(); else revealAndRender();
}

function logItAndMoveOn(){
  if(!state.ambiguous) return;
  state.teaStreak = 0;
  var amb = state.ambiguous;
  var spx = findSpecies(amb.speciesId);
  var site = activeSite();
  state.gotAway.push({ siteId: site.id, siteName: site.name, at: fmtClock(state.clock), group: spx.group, audio: spx.audio, speciesId: spx.id, speciesName: spx.name });
  addLog("Logged as unidentified, and you move on.", "system");
  state.ambiguous = null;
  resumePendingLoopOrRender();
}

/* Core single-hop drive: advances the clock, spends energy, rolls the
   roadside raptor chance and the usual arrival event, and drops a
   "Drove to X" log line — everything doTravel() used to do, minus the
   UI-only bits (closing the travel sheet, switching tabs, animating the
   reveal), so a multi-hop trip can chain several of these back to back
   and only animate once, at the very end. Returns false if there's no
   direct road for this leg. */
function travelHop(destId){
  if(state.ended || destId===state.currentSite) return false;
  var cost = state.travel[state.currentSite][destId];
  if(cost===undefined) return false;
  if(state.loadout.backroads) cost = Math.round(cost * CONFIG.backroads.mult);
  var originId = state.currentSite;
  var edgeKey = [state.currentSite, destId].sort().join("|");
  state.traveledEdges[edgeKey] = true;
  if(state.roadworksPending>0){
    var extraMin = Math.round(cost * state.roadworksPending);
    cost += extraMin;
    addLog("Roadworks slowed the drive by " + extraMin + " extra minutes (+" + Math.round(state.roadworksPending*100) + "%).", "system");
    state.roadworksPending=0;
  }
  state.clock += cost;
  spendEnergy(CONFIG.energyRates.drive*cost/60);
  state.currentSite = destId;
  state.currentZone = SITES[destId].zones ? SITES[destId].zones[0].id : null;
  state.minutesOnSite = 0;
  state.confirmedThisVisit = {};
  addLog("Drove to " + activeSite().name + " — " + cost + " minutes on the road.", "travel");
  maybeRoadsideRaptor(originId, destId, cost);
  pruneEffects();
  maybeTriggerEvent("road");
  simulateRivals(state.clock);
  checkAutoTransitions();
  return true;
}

function doTravel(destId){
  if(state.ended) return;
  state.teaStreak = 0;
  if(destId===state.currentSite) { state.sheet=null; render(); return; }
  var ok = travelHop(destId);
  state.sheet = null;
  if(!ok){ render(); return; }
  state.tab = "activity";
  revealAndRender();
}

/* Dijkstra shortest path (by minutes, backroads discount included) from
   fromId to toId over the current road network, so clicking a site on
   the map can drive there even when it's several roads away instead of
   only ever offering the direct neighbours. */
function shortestPath(fromId, toId){
  var dist = {}, prev = {}, visited = {};
  SITE_IDS.forEach(function(id){ dist[id] = Infinity; });
  dist[fromId] = 0;
  var queue = SITE_IDS.slice();
  while(queue.length){
    queue.sort(function(a,b){ return dist[a]-dist[b]; });
    var u = queue.shift();
    if(dist[u]===Infinity) break;
    visited[u] = true;
    if(u===toId) break;
    var neighbors = state.travel[u] || {};
    Object.keys(neighbors).forEach(function(v){
      if(visited[v]) return;
      var cost = neighbors[v];
      if(state.loadout.backroads) cost = Math.round(cost * CONFIG.backroads.mult);
      var alt = dist[u] + cost;
      if(alt < dist[v]){ dist[v] = alt; prev[v] = u; }
    });
  }
  if(dist[toId]===undefined || dist[toId]===Infinity) return null;
  var path = [toId], cur = toId;
  while(cur!==fromId){
    cur = prev[cur];
    if(cur===undefined) return null;
    path.unshift(cur);
  }
  return path;
}

/* Clicking a location on the map drives there via however many roads
   that takes, one hop after another, stopping automatically at each
   town along the way (each leg still gets its own roadside-raptor
   chance and random event) rather than needing one click per leg. */
/* Total minutes for a multi-hop path (backroads discount included, same
   as shortestPath's own distances), used to check the whole trip against
   the midnight cutoff before setting off on any of it. */
function pathTotalMinutes(path){
  var total = 0;
  for(var i=1;i<path.length;i++){
    var cost = state.travel[path[i-1]] && state.travel[path[i-1]][path[i]];
    if(cost===undefined) return Infinity;
    if(state.loadout.backroads) cost = Math.round(cost * CONFIG.backroads.mult);
    total += cost;
  }
  return total;
}

function doTravelToViaShortestRoute(destId){
  if(state.ended || state.ambiguous) return;
  if(destId===state.currentSite) return;
  var path = shortestPath(state.currentSite, destId);
  if(!path) return;
  /* Clicking a map pin has no "disabled" state to show up front, so this
     guard is what actually stops a drive that couldn't be finished
     before the automatic midnight camp cutoff — the direct-road buttons
     on the Travel tab show this same limit visually. */
  if(wouldCrossCutoff(pathTotalMinutes(path))){
    addLog("That drive would run past " + cutoffLabel() + " — " + (state.day==="Sunday" ? "call it a weekend" : "make camp") + " instead, or head somewhere closer first.", "system");
    render();
    return;
  }
  state.teaStreak = 0;
  for(var i=1;i<path.length;i++){
    if(state.ended) break;
    if(!travelHop(path[i])) break;
  }
  state.sheet = null;
  state.tab = "activity";
  revealAndRender();
}

/* ---- A chance of a raptor sighting mid-drive, rising with the length of
   the road. Drawn from whatever raptors either end of the trip could turn
   up; resolves on the spot (you're moving, so no "keep looking"). ---- */
function roadsideRaptorChance(minutes){
  var cfg = CONFIG.roadsideRaptor;
  var span = Math.max(1, CONFIG.travelCeiling - cfg.minMinutes);
  return clamp((minutes - cfg.minMinutes) / span, 0, 1) * cfg.maxChance;
}

function maybeRoadsideRaptor(originId, destId, minutes){
  var cfg = CONFIG.roadsideRaptor;
  if(minutes < cfg.minMinutes) return;
  var chance = roadsideRaptorChance(minutes);
  if(rnd() > chance) return;

  var pool = [];
  [originId, destId].forEach(function(sid){
    var s = SITES[sid];
    if(!s || s.zones) return;
    s.species.forEach(function(spx){
      if(spx.group==="raptor" && !state.confirmed[spx.id]) pool.push({ spx: spx, siteId: sid, siteName: s.name });
    });
  });
  if(!pool.length) return;

  var choice = pick(pool);
  var spx = choice.spx;
  var pseudoSite = { id: choice.siteId, zoneId: null, name: "the road near " + choice.siteName };
  var id = idChance(spx, pseudoSite, 0) * cfg.idPenalty;
  if(rnd() < id){
    addToLifeList(spx, pseudoSite);
    addLog("A <b>" + spx.name + "</b> wheels over the road ahead — close enough to call. Confirmed on the drive.", "encounter");
  } else {
    state.gotAway.push({ siteId: choice.siteId, siteName: pseudoSite.name, at: fmtClock(state.clock), group: "raptor", audio: false, speciesId: spx.id, speciesName: spx.name });
    addLog("Something big circles over the road — gone before anyone can pin the species. One that got away.", "travel");
  }
}

function doChangeZone(zoneId){
  if(state.currentSite!=="ninetymile" || zoneId===state.currentZone) { state.sheet=null; render(); return; }
  state.teaStreak = 0;
  var minutes = 20;
  state.clock += minutes;
  spendEnergy(CONFIG.energyRates.walk*minutes/60);
  state.currentZone = zoneId;
  state.minutesOnSite = 0;
  state.confirmedThisVisit = {};
  state.sheet = null;
  addLog("Walked over to " + activeSite().name + ".", "system");
  maybeTriggerEvent();
  simulateRivals(state.clock);
  checkAutoTransitions();
  state.tab = "activity";
  revealAndRender();
}

/* The theoretical decayed restore for the *next* tea break, given the
   current streak — used so the button/overlay can tell the truth about
   what pressing it will actually do, before you commit to it. */
function nextTeaBreakRestore(){
  var streak = (state.teaStreak||0) + 1;
  return Math.max(CONFIG.teaBreak.restoreFloor, Math.round(CONFIG.teaBreak.restore * Math.pow(CONFIG.teaBreak.restoreDecay, streak-1)));
}
/* Same, but clamped to however much headroom is actually left below the
   energy ceiling — if you're already topped up, this reads 0 rather than
   implying a gain that the cap would swallow anyway. */
function nextTeaBreakGain(){
  return Math.max(0, Math.round(Math.min(nextTeaBreakRestore(), state.energyCeiling - state.energy)));
}

function doTeaBreak(){
  if(state.ended) return;
  state.teaStreak = (state.teaStreak||0) + 1;
  var restore = Math.max(CONFIG.teaBreak.restoreFloor, Math.round(CONFIG.teaBreak.restore * Math.pow(CONFIG.teaBreak.restoreDecay, state.teaStreak-1)));
  state.clock += CONFIG.teaBreak.minutes;
  var before = state.energy;
  state.energy = clamp(state.energy + restore, 0, state.energyCeiling);
  var gained = Math.round(state.energy - before);
  if(state.ambiguous){ addLog("You break for tea — the chase is over.", "system"); state.ambiguous=null; }
  state.activeEffects = state.activeEffects.filter(function(e){ return e.type!=="dewy"; });
  var teaMsg;
  var cappedNote = state.energyCeiling<100 ? " (still capped at "+state.energyCeiling+")" : "";
  if(gained<=0){
    teaMsg = "Tea break. Twenty-five minutes in the shade. You're already topped up"+cappedNote+", so there's no energy left to gain.";
  } else if(gained<restore){
    teaMsg = "Tea break. Twenty-five minutes, tops the last +"+gained+" energy back up to "+(state.energyCeiling<100 ? "your capped max of "+state.energyCeiling : "full")+".";
  } else if(restore>=CONFIG.teaBreak.restore){
    teaMsg = "Tea break. Twenty-five minutes, and everyone feels a world better for it.";
  } else {
    teaMsg = "Another tea break so soon, twenty-five minutes, but it's only worth +"+restore+" energy this time.";
  }
  addLog(teaMsg, "tea");
  simulateRivals(state.clock);
  checkAutoTransitions();
  resumePendingLoopOrRender();
}

function eatSnack(){
  if(state.ended || state.snackBars<=0) return;
  state.teaStreak = 0;
  state.snackBars -= 1;
  state.energy = clamp(state.energy + CONFIG.snackRestore, 0, state.energyCeiling);
  if(state.ambiguous){ addLog("A snack on the move, and the chase is dropped.", "system"); state.ambiguous=null; }
  else addLog("Snack down. Small mercies.", "system");
  resumePendingLoopOrRender();
}


/* ---- random events ----
   Gated to at most one roll per in-game hour: maybeTriggerEvent() is
   called after every watch chunk, every resolved ambiguous ID, every
   arrival by road, and every zone change, but it only actually rolls the
   dice the first time it's called in a given clock-hour (see the
   lastEventHour guard below). That roll is a flat 20% chance, so an hour
   might pass with nothing at all, but two events can never land inside
   the same hour. */
function maybeTriggerEvent(context){
  context = context || "site";
  var hourBucket = Math.floor(state.clock / 60);
  if(state.lastEventHour === hourBucket) return;
  state.lastEventHour = hourBucket;
  if(rnd() > CONFIG.eventChance) return;
  var type = pick(CONFIG.eventPool);
  switch(type){
    case "rareAlert": {
      var pool = FLAT_SPECIES.filter(function(f){ return (f.species.tier==="rare"||f.species.tier==="mega") && !state.confirmed[f.species.id]; });
      if(!pool.length) return;
      var f = pick(pool);
      /* Mega alerts run shorter than rare ones — the detection boost they
         carry (12x, vs. 3x for a rare) is so large that giving it the same
         8-hour window as a rare alert would make megas trivial to bank
         off a single lucky tip-off. */
      var durMin = f.species.tier==="mega" ? 240 : 480;
      var boostPct = Math.round(((f.species.tier==="mega" ? 12 : 3)-1)*100);
      state.activeEffects.push({ type:"rareAlert", siteId: f.siteId, zoneId: f.zoneId, speciesId: f.species.id, expiresAtClock: state.clock+durMin, label: f.label + ": " + f.species.name });
      addLog("Group chat lights up: <b>" + f.species.name + "</b> reported at " + f.label + " — detection there is up " + boostPct + "% for the next " + fmtDuration(durMin) + ", or until someone gets onto it.", "event");
      break;
    }
    case "localTip": {
      var pool2 = FLAT_SPECIES.filter(function(f){ return f.species.tier==="uncommon" && !state.confirmed[f.species.id]; });
      if(!pool2.length) return;
      var f2 = pick(pool2);
      /* No time limit at all — this one stands until the bird's ticked,
         the weekend ends, or an overnight camp clears every effect. */
      state.activeEffects.push({ type:"localTip", siteId: f2.siteId, zoneId: f2.zoneId, speciesId: f2.species.id, expiresAtClock: null, label: f2.label + ": " + f2.species.name });
      addLog("A local birder tips you off: <b>" + f2.species.name + "</b> showing well at " + f2.label + " — detection there is up 120% for the rest of the weekend, or until it's ticked.", "event");
      break;
    }
    case "dewyOptics": {
      /* Only ever rolls in the early-morning window, and now capped at a
         flat hour regardless of when your next tea break falls. */
      if(minuteOfDay(state.clock) >= 600) return;
      state.activeEffects = state.activeEffects.filter(function(e){ return e.type!=="dewy"; });
      state.activeEffects.push({ type:"dewy", expiresAtClock: state.clock+60, label:"Fogged optics" });
      addLog("Morning mist fogs the bins — detection's down 15% for up to the next hour, or until your next tea break, whichever comes first.", "event");
      break;
    }
    case "magpieSwoop":
      spendEnergy(5);
      state.activeEffects = state.activeEffects.filter(function(e){ return e.type!=="magpie"; });
      state.activeEffects.push({ type:"magpie", expiresAtClock: state.clock+45, label:"Distracted" });
      addLog("Swooped on the track in — cost 5 energy on the spot, and detection's down 10% for the next 45 minutes while everyone's rattled.", "event");
      break;
    case "rivalEncounter": {
      simulateRivals(state.clock);
      var who = pick(RIVAL_DEFS);
      var whereText = context==="road" ? "at a servo on the drive" : "at " + activeSite().name;
      addLog('Cross paths with "' + who.name + '" ' + whereText + " — sitting on " + state.rivals.counts[who.key] + " species, by their own account.", "event");
      break;
    }
    case "coldFront": {
      var siteId = pick(["beachportlagoon","boollagoon"]);
      var cfDur = 480;
      state.activeEffects.push({ type:"coldFront", siteId: siteId, expiresAtClock: state.clock+cfDur, label:"Fallout: "+SITES[siteId].name });
      state.forcedBadNight = true;
      addLog("A cold front's rolled in off the Bight — migrants pushed toward " + SITES[siteId].name + ", water-bird detection there is up 150% for the next " + fmtDuration(cfDur) + ". Tonight's camp will be colder for it.", "event");
      break;
    }
    case "roadworks": {
      var pct = randRange(0.20, 0.45);
      state.roadworksPending = pct;
      addLog("Word of roadworks ahead — your next drive could run " + Math.round(pct*100) + "% longer.", "event");
      break;
    }
    case "distantSilhouette": {
      var site3 = activeSite();
      var preferredGroup = pick(["bush","water","raptor"]);
      var pool3 = site3.species.filter(function(s){ return !state.confirmed[s.id]; });
      var groupPool3 = pool3.filter(function(s){ return s.group===preferredGroup; });
      var spx3 = (groupPool3.length ? pick(groupPool3) : (pool3.length ? pick(pool3) : null));
      state.gotAway.push({
        siteId: site3.id, siteName: site3.name, at: fmtClock(state.clock),
        group: spx3 ? spx3.group : preferredGroup, audio: spx3 ? spx3.audio : rnd()<0.4,
        speciesId: spx3 ? spx3.id : null, speciesName: spx3 ? spx3.name : null
      });
      addLog("A shape crosses high overhead, or calls once from way off — gone before anyone can say what it was. No detect roll, no ID chance: straight onto the one-that-got-away list.", "event");
      break;
    }
    case "goldenLight": {
      var glDur = 30;
      state.activeEffects = state.activeEffects.filter(function(e){ return e.type!=="goldenLight"; });
      state.activeEffects.push({ type:"goldenLight", expiresAtClock: state.clock+glDur, label:"Perfect light" });
      addLog("The light turns perfect for a while — detection's up 15% across the board for the next " + fmtDuration(glDur) + ".", "event");
      break;
    }
    case "luckyBreak": {
      var lbDur = 180;
      state.activeEffects.push({ type:"luckyBreak", expiresAtClock: state.clock+lbDur, label:"Lucky break" });
      addLog("Everything lines up just right — the next bird anyone gets eyes on in the next " + fmtDuration(lbDur) + " is a guaranteed, clean ID.", "event");
      break;
    }
    case "secondWind": {
      var beforeE = state.energy;
      state.energy = clamp(state.energy + 15, 0, state.energyCeiling);
      var gainedE = Math.round(state.energy - beforeE);
      addLog(gainedE>0 ? "Someone digs a stashed drink out of the bottom of the pack — +" + gainedE + " energy, no break needed." : "Someone digs a stashed drink out of the pack, but you're already topped up.", "event");
      break;
    }
    case "windPickup": {
      var wpDur = 30;
      state.activeEffects = state.activeEffects.filter(function(e){ return e.type!=="windPickup"; });
      state.activeEffects.push({ type:"windPickup", expiresAtClock: state.clock+wpDur, label:"Windy" });
      addLog("Wind picks up — bush birds sit tight and go quiet, detection there down 10% for the next " + fmtDuration(wpDur) + ".", "event");
      break;
    }
    case "gearFumble": {
      var gfDur = 30;
      state.activeEffects = state.activeEffects.filter(function(e){ return e.type!=="gearFumble"; });
      state.activeEffects.push({ type:"gearFumble", expiresAtClock: state.clock+gfDur, label:"Fumbled" });
      addLog("Dropped lens cap, tangled strap — ID chance down 15% for the next " + fmtDuration(gfDur) + " while you sort yourself out.", "event");
      break;
    }
    case "chatWithLocal":
      addLog("A local walks past and stops for a chat — no birding tips, but a nice few minutes all the same.", "event");
      break;
  }
}

/* ---- rivals ---- */
/* Seven other teams on the map, each running a different weekend plan.
   Their species counts are an abstraction (not tied to the real site
   data or detection odds) but each formula reflects how that plan
   would actually play out: breadth vs. depth, patience vs. impulse,
   dawn specialism vs. no plan at all. */
/* Random fallback team names, assigned if the player leaves the field blank. */
var RANDOM_TEAM_NAMES = ["Canaries in the Coalmine","Tarred and Feathered","Road Chickens","Worm Getters","Time for a Murder","Thunderbirds","Let's Get Twitchy"];

var RIVAL_DEFS = [
  { key:"galahs",     name:"Flaming Galahs",           tag:"The Sprinters",      desc:"try to hit every site on the map, never lingering long enough to wear out a welcome" },
  { key:"coots",      name:"Old Coots",                tag:"The Completionists", desc:"pick a spot and grind it out until there's nothing left to find" },
  { key:"twitchy",    name:"Getting Twitchy",          tag:"The Chasers",        desc:"can't sit still — first whisper of a rare bird and they're gone" },
  { key:"early",      name:"The Early Birds",          tag:"The Dawn Patrol",    desc:"up before first light, running out of steam well before lunch" },
  { key:"pair",       name:"What a lovely pair of..?", tag:"The Specialists",    desc:"beeline for the richest sites and settle in, barely stopping anywhere else" },
  { key:"brains",     name:"Bird Brains",              tag:"The Wanderers",      desc:"no real plan, just enthusiasm — somehow it mostly works out" },
  { key:"bowerbirds", name:"The Bowerbirds",           tag:"The Collectors",     desc:"won't leave a site until every common and uncommon species there is ticked off — the rares can wait" }
];

/* Fixed avatar colors per rival (plus the player) — decorative, not tied to
   the light/dark palette, so they read consistently on either theme. */
var AVATAR_COLORS = { you:"#3f6b46", galahs:"#c1692c", coots:"#7a5ba6", twitchy:"#a5402f", early:"#3f76a8", pair:"#9c7a1f", brains:"#4f8f6b", bowerbirds:"#8a5a3f" };
function avatarMarkup(name, colorKey){
  var initial = (name||"?").trim().charAt(0).toUpperCase() || "?";
  return '<span class="avatar" style="background:'+(AVATAR_COLORS[colorKey]||"#6b6247")+'">'+esc(initial)+'</span>';
}

/* ---- rivals: seven real simulated strategies on the same map ----
   Every rival here is a genuine bot walking the same site graph and using
   the same detection/ID math the player does — none of them are hand-tuned
   hourly averages any more. What makes each one feel like its archetype is
   purely the decision policy below: which site it heads for next, how long
   a loop it commits to, and how stubborn it is about moving on. */

var SMART_CHUNK = CONFIG.chunkMinutes;
var SMART_LOW_ENERGY = 30;
var SMART_LOW_ENERGY_BY_KEY = { brains: 20 };

function smartBotLowEnergyThreshold(key){
  return SMART_LOW_ENERGY_BY_KEY[key]!==undefined ? SMART_LOW_ENERGY_BY_KEY[key] : SMART_LOW_ENERGY;
}

function createSmartBot(key){
  var gear = state.rivals.gear[key] || { binoculars:"none", scope:false, fieldGuide:false, weatherproof:false, parabolicMic:false };
  var skill = state.rivals.skills[key];
  var bino = CONFIG.binoculars[gear.binoculars] || CONFIG.binoculars.none;
  return {
    siteId: state.currentSite,
    clock: 0,
    energy: 100,
    energyCeiling: 100,
    minutesOnSite: 0,
    teaStreak: 0,
    loopsHere: 0,
    confirmedNames: {},
    phase: "decide",
    loopRemaining: 0,
    loopBonus: 1,
    loopMode: "walk",
    travelRemaining: 0,
    travelDest: null,
    skill: skill,
    gear: gear,
    fatigueMult: skill==="ironConstitution" ? CONFIG.ironConstitution.mult : 1,
    binocDet: bino.det + (skill==="youngEyes" ? CONFIG.youngEyes.detBonus : 0),
    binocId: bino.id
  };
}

function spendSmartEnergy(bot, amount){
  bot.energy = clamp(bot.energy - amount*(bot.fatigueMult||1), 0, bot.energyCeiling);
}

function countUnseenAtSite(siteId, confirmedNames){
  var s = SITES[siteId];
  if(!s || s.zones) return 0;
  var n = 0;
  s.species.forEach(function(sp){ if(!confirmedNames[sp.name]) n++; });
  return n;
}

/* Same idea, but counting only the common/uncommon tier — what the
   Bowerbirds (see RIVAL_DEFS) work a site down to zero on before they'll
   consider moving on. Rares and megas don't factor into their decision
   either way: still up for grabs while they're there, never a reason to
   stay or go. */
function countUnseenBasicAtSite(siteId, confirmedNames){
  var s = SITES[siteId];
  if(!s || s.zones) return 0;
  var n = 0;
  s.species.forEach(function(sp){
    if((sp.tier==="common"||sp.tier==="uncommon") && !confirmedNames[sp.name]) n++;
  });
  return n;
}

function smartBotDistancePenalty(bot, site, species){
  if(bot.gear.scope) return 1;
  if(site.id==="banghamcp" && species.group==="raptor") return CONFIG.effects.distancePenaltyMult;
  if(site.id==="lakeleake" && species.group==="water") return CONFIG.effects.distancePenaltyMult;
  if(site.id==="boollagoon" && species.group==="water") return CONFIG.effects.distancePenaltyMult;
  return 1;
}

/* Same formula the player's own detectionChance/idChance use — reusing
   ABUNDANCE, the activity table, weather, time-on-site decay and every
   gear/skill multiplier — just fed this bot's own state instead of the
   player's, so its odds are exactly as real as the player's. */
function smartBotDetectionChance(bot, site, species){
  var base = ABUNDANCE[species.tier];
  var wIdx = windowIndex(bot.clock);
  var todMult = CONFIG.activityMult[species.group][wIdx];
  if(todMult<=0) return 0;
  var weatherMult = state.weatherMult===undefined ? 1 : state.weatherMult;
  if(bot.gear.weatherproof) weatherMult = Math.max(weatherMult, CONFIG.effects.weatherproofFloor);
  var hasMist = state.activeEffects.some(function(e){ return e.type==="mist"; });
  if(hasMist && WET_SITE_IDS[site.id] && species.group==="water" && !species.audio && !bot.gear.weatherproof) weatherMult *= CONFIG.effects.mistWaterMult;
  var spotMult = 1 + bot.binocDet/100;
  var eTier = energyTier(bot.energy);
  var tosMult = timeOnSiteMult(bot.minutesOnSite, site.size);
  var effectMult = 1;
  var coldFront = state.activeEffects.some(function(e){ return e.type==="coldFront" && e.siteId===site.id && species.group==="water"; });
  if(coldFront) effectMult *= CONFIG.effects.coldFrontMult;
  if(bot.skill==="twitchersNose" && (species.tier==="rare"||species.tier==="mega")) effectMult *= CONFIG.twitchersNose.mult;
  if(bot.gear.parabolicMic && species.audio) effectMult *= CONFIG.effects.parabolicMicDetectMult;
  var chance = base * todMult * weatherMult * spotMult * eTier.mult * tosMult * effectMult * (bot.loopBonus||1);
  return Math.min(chance, 0.95);
}

function smartBotIdChance(bot, site, species){
  var skillMult = 1 + bot.binocId/100;
  var eTier = energyTier(bot.energy);
  var fieldGuideMult = (bot.gear.fieldGuide && isConfusing(species.name)) ? CONFIG.effects.fieldGuideMult : 1;
  var distMult = smartBotDistancePenalty(bot, site, species);
  var scopeMult = (bot.gear.scope && species.group==="raptor") ? CONFIG.effects.scopeRaptorIdMult : 1;
  var micMult = (bot.gear.parabolicMic && species.audio) ? CONFIG.effects.parabolicMicIdMult : 1;
  var preDawnMult = (windowIndex(bot.clock)===0 && species.group!=="nocturnal") ? CONFIG.effects.preDawnNonNocturnalIdMult : 1;
  var chance = species.idDiff * skillMult * eTier.mult * fieldGuideMult * distMult * scopeMult * micMult * preDawnMult;
  return clamp(chance, 0.02, 0.97);
}

/* Which loop a rival commits to once it decides to search here — the one
   real lever, besides movement, that separates "cover ground fast" from
   "settle in properly". */
function smartBotLoopKey(key, keys){
  switch(key){
    case "galahs": return keys[0]; /* shortest — never linger long enough to wear out a welcome */
    case "brains": return keys[Math.floor(rnd()*keys.length)]; /* whatever, no plan */
    default: return keys[keys.length-1]; /* coots, twitchy, early, pair — commit to the full loop */
  }
}

function startSmartBotLoop(key, bot){
  var site = SITES[bot.siteId];
  bot.minutesOnSite = 0;
  if(site.hide){
    bot.phase = "loop";
    bot.loopMode = "hide";
    bot.loopRemaining = CONFIG.hideSearch.minutes;
    bot.loopBonus = 1;
  } else {
    var keys = getLoopOptions(site);
    var loopKey = smartBotLoopKey(key, keys);
    var cfg = CONFIG.loop[loopKey];
    bot.phase = "loop";
    bot.loopMode = "walk";
    bot.loopRemaining = cfg.minutes;
    bot.loopBonus = cfg.bonus;
  }
  /* Dawn Patrol specialists are sharpest right at first light — a small
     edge on top of whatever the loop itself already gives. */
  if(key==="early"){
    var wIdxNow = windowIndex(bot.clock);
    if(wIdxNow===0 || wIdxNow===1) bot.loopBonus *= 1.15;
  }
  bot.loopsHere = (bot.loopsHere||0) + 1;
}

function startSmartBotTravel(bot, destId, cost){
  if(bot.skill==="backroads") cost = Math.round(cost * CONFIG.backroads.mult);
  bot.phase = "travel";
  bot.travelRemaining = cost;
  bot.travelDest = destId;
}

/* The richness-greedy fallback nearly every archetype leans on somewhere:
   the richest directly-reachable site beats staying, ties broken by the
   shorter drive; otherwise keep working the loop right here. */
function smartBotRichestNeighborOrStay(key, bot, travelTable, reachable, hereRichness){
  var best = null;
  reachable.forEach(function(id2){
    var richness2 = countUnseenAtSite(id2, bot.confirmedNames);
    if(richness2<=0) return;
    if(!best || richness2>best.richness || (richness2===best.richness && travelTable[id2]<best.cost)){
      best = { id:id2, richness:richness2, cost: travelTable[id2] };
    }
  });
  if(best && (hereRichness<=0 || best.richness>hereRichness)){
    startSmartBotTravel(bot, best.id, best.cost);
  } else {
    startSmartBotLoop(key, bot);
  }
}

/* One decision per arrival/loop-end: where next, or work this site again.
   Six different personalities on top of the same shared machinery. */
function smartBotChooseMove(key, bot){
  var hereRichness = countUnseenAtSite(bot.siteId, bot.confirmedNames);
  var travelTable = state.travel[bot.siteId] || {};
  var reachable = Object.keys(travelTable).filter(function(id2){ return id2!==bot.siteId; });

  if(key==="twitchy"){
    /* Chasers: the first whisper of a rare bird or a local tip and they're
       gone, whatever's left where they're standing. */
    var chase = null;
    state.activeEffects.forEach(function(e){
      if((e.type==="rareAlert"||e.type==="localTip") && e.siteId && e.siteId!==bot.siteId && travelTable[e.siteId]!==undefined){
        chase = e.siteId;
      }
    });
    if(chase && rnd()<0.7){
      startSmartBotTravel(bot, chase, travelTable[chase]);
      return;
    }
  }

  if(key==="galahs"){
    /* Sprinters: never linger long enough to wear out a welcome — one loop
       and they're off to whatever's closest, richness allowing. */
    if(bot.loopsHere>=1 && reachable.length){
      var nearest = null;
      reachable.forEach(function(id2){
        var richness2 = countUnseenAtSite(id2, bot.confirmedNames);
        if(richness2<=0) return;
        if(!nearest || travelTable[id2]<travelTable[nearest]) nearest = id2;
      });
      if(nearest){ startSmartBotTravel(bot, nearest, travelTable[nearest]); return; }
    }
    if(hereRichness>0){ startSmartBotLoop(key, bot); return; }
  }

  if(key==="brains"){
    /* Wanderers: no real plan — mostly a coin flip between staying put
       and wandering off to wherever, richness be damned. */
    if(hereRichness>0 && rnd()<0.55){ startSmartBotLoop(key, bot); return; }
    if(reachable.length){
      var choice = reachable[Math.floor(rnd()*reachable.length)];
      startSmartBotTravel(bot, choice, travelTable[choice]);
      return;
    }
    startSmartBotLoop(key, bot);
    return;
  }

  if(key==="coots"){
    /* Completionists: pick a spot and grind it out until there's nothing
       left to find, then move. */
    if(hereRichness>0){ startSmartBotLoop(key, bot); return; }
  }

  if(key==="bowerbirds"){
    /* Collectors: won't leave until every common and uncommon species here
       is ticked off. Unlike the Completionists, a rare or mega sitting
       unconfirmed doesn't hold them — once the basics are done, they move,
       whatever else might still be out there. */
    if(countUnseenBasicAtSite(bot.siteId, bot.confirmedNames)>0){ startSmartBotLoop(key, bot); return; }
  }

  /* pair falls straight in here every time; coots, galahs, twitchy and
     bowerbirds fall through to it once their special case doesn't fire. */
  smartBotRichestNeighborOrStay(key, bot, travelTable, reachable, hereRichness);
}

function smartBotChunk(key, bot){
  if(key==="early"){
    /* Fading fast once the sun's up: a lower ceiling in the afternoon/
       evening means they're stuck in "Flagging" rather than "Fresh" no
       matter how much tea they take, until the next dawn resets it. */
    var wIdxNow = windowIndex(bot.clock);
    bot.energyCeiling = (wIdxNow<=1) ? 100 : 55;
    if(bot.energy > bot.energyCeiling) bot.energy = bot.energyCeiling;
  }

  if(bot.phase==="decide"){
    if(bot.energy < smartBotLowEnergyThreshold(key)) bot.phase = "tea";
    else smartBotChooseMove(key, bot);
  }

  bot.clock += SMART_CHUNK;

  if(bot.phase==="tea"){
    bot.teaStreak = (bot.teaStreak||0) + 1;
    var restore = Math.max(CONFIG.teaBreak.restoreFloor, Math.round(CONFIG.teaBreak.restore * Math.pow(CONFIG.teaBreak.restoreDecay, bot.teaStreak-1)));
    bot.energy = clamp(bot.energy + restore, 0, bot.energyCeiling);
    bot.clock += Math.max(0, CONFIG.teaBreak.minutes - SMART_CHUNK);
    bot.phase = "decide";
    return;
  }

  if(bot.phase==="travel"){
    bot.travelRemaining -= SMART_CHUNK;
    spendSmartEnergy(bot, CONFIG.energyRates.drive*SMART_CHUNK/60);
    if(bot.travelRemaining<=0){
      bot.siteId = bot.travelDest;
      bot.travelDest = null;
      bot.teaStreak = 0;
      bot.loopsHere = 0;
      bot.phase = "decide";
    }
    return;
  }

  if(bot.phase==="loop"){
    var site = SITES[bot.siteId];
    var rate = bot.loopMode==="hide" ? CONFIG.energyRates.hide : CONFIG.energyRates.walk;
    spendSmartEnergy(bot, rate*SMART_CHUNK/60);
    bot.minutesOnSite += SMART_CHUNK;
    var candidates = shuffle(site.species.filter(function(sp){
      return !bot.confirmedNames[sp.name] && (bot.loopMode!=="hide" || sp.group==="water");
    }));
    for(var i=0;i<candidates.length;i++){
      var sp = candidates[i];
      if(rnd() < smartBotDetectionChance(bot, site, sp) && rnd() < smartBotIdChance(bot, site, sp)){
        bot.confirmedNames[sp.name] = true;
      }
    }
    bot.loopRemaining -= SMART_CHUNK;
    if(bot.loopRemaining<=0){
      bot.teaStreak = 0;
      bot.phase = "decide";
    }
    return;
  }
}

function advanceSmartBot(key, uptoClock){
  var bot = state.rivals.smart && state.rivals.smart[key];
  if(!bot) return;
  var guard = 0;
  while(bot.clock + SMART_CHUNK <= uptoClock && guard < 4000){
    smartBotChunk(key, bot);
    guard++;
  }
  state.rivals.counts[key] = Object.keys(bot.confirmedNames).length;
}

function simulateRivals(uptoClock){
  RIVAL_DEFS.forEach(function(r){ advanceSmartBot(r.key, uptoClock); });
}

/* ---- weather ---- */
var WEATHER = [
  { id:"clear", label:"Clear, light breeze", mult:1.0 },
  { id:"overcast", label:"Overcast", mult:1.03 },
  { id:"rain", label:"Rain", mult:0.82 },
  { id:"mist", label:"Mist over the flats", mult:0.9 },
  { id:"southerly", label:"Strong southerly", mult:0.87 }
];
function rollWeather(){
  var w = pick(WEATHER);
  state.weatherMult = w.mult;
  state.weatherLabel = w.label;
  if(w.id==="mist") state.activeEffects.push({ type:"mist", expiresAtClock: state.clock+240, label:"Misty" });
  return w;
}

/* ---- day transitions ---- */
function checkAutoTransitions(){
  /* Never cut to camp or end the game out from under an open "What was
     that?" chase — processChunk/resolveKeepLooking call this regardless
     of whether state.ambiguous just got set (or is still unresolved),
     and render() dispatches purely on state.phase, so a same-beat camp
     or end-game transition would silently swallow the ambiguous panel
     forever. Deferring here just means the transition fires on the next
     call, once the chase is actually resolved one way or another. */
  if(state.ambiguous) return;
  if(state.phase==="play" && state.day==="Saturday" && state.clock>=CONFIG.saturdayEnd){
    enterCamp();
  }
  if(state.phase==="play" && state.day==="Sunday" && state.clock>=CONFIG.deadline && !state.ended){
    endGame(true, "3:00pm Sunday. Time's up!");
  }
}

function enterCamp(){
  simulateRivals(CONFIG.saturdayEnd);
  /* Making camp — pitching tents, sorting gear — takes an hour before
     anyone can actually turn in for the night. A manual "Make camp"
     before midnight starts that hour from whenever you actually stopped
     (8pm, 9:30pm, whatever) rather than being forced all the way out to
     midnight; the automatic cutoff still lands on midnight itself, since
     that's when it fires. Math.min covers both cases with one line —
     an early manual camp leaves state.clock untouched (it's already
     below saturdayEnd), while the automatic transition (clock already
     at or just past saturdayEnd) clamps back down to exactly midnight. */
  var campStart = Math.min(state.clock, CONFIG.saturdayEnd);
  state.clock = campStart + 60;
  state.campSiteId = state.currentSite;
  state.campFinishClock = state.clock;
  state.phase = "camp";
  render();
}

/* Wake-up choices are fixed clock times (4am / 5am / 6am) rather than
   fixed sleep durations — how many hours that actually takes depends on
   when camp was finished being made (see enterCamp), which can now be
   any time from 8pm on, not just midnight. */
var WAKE_OPTIONS = [240, 300, 360]; /* minuteOfDay for 4am, 5am, 6am */

function wakeOptions(){
  var from = state.campFinishClock!=null ? state.campFinishClock : CONFIG.saturdayEnd;
  return WAKE_OPTIONS.map(function(target){
    var wakeClock = nextOccurrenceOfMinuteOfDay(from, target);
    return { wakeClock: wakeClock, hours: (wakeClock - from)/60 };
  });
}

/* Preview of what a given wake option would restore, given the player's
   current energy — a coin-flip 30% chance of a "bad night" halves the
   recovery rate (see chooseSleep below), unless a cold front has
   already guaranteed one, so both figures are surfaced rather than
   picking one to show and hoping it's the one that lands. There's no
   more hidden ceiling either — a long enough sleep can now take you
   all the way back to full. */
function sleepEnergyPreview(hours){
  var goodGain = Math.round(Math.min(100, state.energy + hours*CONFIG.sleep.tentRate) - state.energy);
  var badGain = Math.round(Math.min(100, state.energy + hours*CONFIG.sleep.tentBadRate) - state.energy);
  return { goodGain: goodGain, badGain: badGain };
}

function chooseSleep(wakeClock){
  state.teaStreak = 0;
  var badNight = state.forcedBadNight || rnd()<0.3;
  state.forcedBadNight = false;
  var rate = badNight ? CONFIG.sleep.tentBadRate : CONFIG.sleep.tentRate;
  /* Wake time counts on from when camp was actually finished being made,
     not from a fixed midnight anchor. */
  var from = state.campFinishClock!=null ? state.campFinishClock : CONFIG.saturdayEnd;
  var hours = (wakeClock - from)/60;
  var recovered = hours*rate;
  state.energyCeiling = 100;
  state.energy = clamp(state.energy + recovered, 0, 100);
  state.clock = wakeClock;
  state.day = "Sunday";
  state.currentZone = null;
  state.minutesOnSite = 0;
  state.confirmedThisVisit = {};
  state.activeEffects = [];
  state.phase = "play";
  var sleepDur = fmtDuration(hours*60);
  addLog((badNight?"A cold, damp night — ":"") + "Woke after " + sleepDur + (/s$/.test(sleepDur) ? "'" : "'s") + " sleep in the tent. Sunday begins, camped at " + SITES[state.currentSite].name + ".", "system");
  rollWeather();
  render();
}

function attemptTextIn(){
  var site = activeSite();
  endGame(true, "Called it a weekend from " + site.name + " and banked the list early.");
}

function endGame(submitted, reason){
  state.submitted = submitted;
  state.endReason = reason;
  state.ended = true;
  state.phase = "end";
  simulateRivals(Math.min(state.clock, CONFIG.deadline));
  /* Freeze the personal-best comparison right here, once, so it reads the
     same way whether this is the first look at the results screen or a
     return trip from the checklist — otherwise a second render would find
     the score already saved as the best and lose the "new best" framing. */
  var finalScore = distinctConfirmedCount();
  state.finalPrevBest = getBestScore();
  state.finalIsNewBest = setBestScoreIfHigher(finalScore);
  incrementGamesPlayedCount();
  render();
}

/* ============================== REGISTRATION SETUP ============================== */
/* Prices are fixed weekend to weekend now (no more wobble) so they're
   worth memorising, and everything lands on a clean multiple of 5. */
function rollCosts(){
  return {
    mid: CONFIG.binoculars.mid.cost,
    premium: CONFIG.binoculars.premium.cost,
    snackPack: CONFIG.snackPackCostBase,
    scope: CONFIG.scopeCostBase,
    fieldGuide: CONFIG.fieldGuideCostBase,
    weatherproof: CONFIG.weatherproofCostBase,
    parabolicMic: CONFIG.parabolicMicCostBase
  };
}

/* A sparse road network built from a Gabriel graph: two sites get a direct
   road only if no third site sits inside the circle drawn on the line
   between them (the classic "is there a town in the way" test). That gives
   roads that never cross on the map, always favours the genuinely nearest
   sites, and only reaches further when nothing closer is available — no
   redundant loops, but no dead ends either. A couple of tidy-up passes trim
   any site that came out over-connected and rescue any that came out
   under-connected, while keeping every road crossing-free. Travel time
   follows the real distance between sites, so short lines on the map are
   quick hops and long ones are proper hauls. */
function siteDist(positions, a, b){
  var dx = positions[a].x - positions[b].x, dy = positions[a].y - positions[b].y;
  return Math.sqrt(dx*dx + dy*dy);
}
function siteDistSq(positions, a, b){
  var dx = positions[a].x - positions[b].x, dy = positions[a].y - positions[b].y;
  return dx*dx + dy*dy;
}
function segmentsCross(p1,p2,p3,p4){
  function ccw(a,b,c){ return (c.y-a.y)*(b.x-a.x) - (b.y-a.y)*(c.x-a.x); }
  var d1=ccw(p3,p4,p1), d2=ccw(p3,p4,p2), d3=ccw(p1,p2,p3), d4=ccw(p1,p2,p4);
  return ((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0));
}
function isGabrielEdge(positions, a, b){
  var ax=positions[a].x, ay=positions[a].y, bx=positions[b].x, by=positions[b].y;
  for(var i=0;i<SITE_IDS.length;i++){
    var c = SITE_IDS[i];
    if(c===a || c===b) continue;
    var cx=positions[c].x, cy=positions[c].y;
    /* c lies strictly inside the circle with diameter ab iff this dot product is negative */
    if((ax-cx)*(bx-cx) + (ay-cy)*(by-cy) < 0) return false;
  }
  return true;
}

function generateRoadNetwork(positions){
  var softCap = CONFIG.maxDegreeSoft;
  var adj = {}; SITE_IDS.forEach(function(id){ adj[id] = {}; });
  var edges = [];
  function deg(id){ return Object.keys(adj[id]).length; }
  function addEdge(a,b){ adj[a][b]=true; adj[b][a]=true; edges.push([a,b]); }
  function removeEdge(a,b){
    delete adj[a][b]; delete adj[b][a];
    edges = edges.filter(function(e){ return !((e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)); });
  }
  function isConnectedNow(){
    var seen={}, stack=[SITE_IDS[0]]; seen[SITE_IDS[0]]=true; var count=1;
    while(stack.length){ var cur=stack.pop(); Object.keys(adj[cur]).forEach(function(n){ if(!seen[n]){ seen[n]=true; count++; stack.push(n); } }); }
    return count===SITE_IDS.length;
  }

  /* Base graph: every Gabriel-eligible road, all at once. */
  for(var i=0;i<SITE_IDS.length;i++){
    for(var j=i+1;j<SITE_IDS.length;j++){
      var a=SITE_IDS[i], b=SITE_IDS[j];
      if(isGabrielEdge(positions,a,b)) addEdge(a,b);
    }
  }

  /* Trim: any site over the soft cap sheds its longest roads first, but
     never past degree 2 on either end and never if it would disconnect
     the map. */
  var changed = true, guard = 0;
  while(changed && guard<300){
    changed = false; guard++;
    for(var oi=0; oi<SITE_IDS.length; oi++){
      var id = SITE_IDS[oi];
      while(deg(id) > softCap){
        var neighbours = Object.keys(adj[id]).sort(function(x,y){ return siteDistSq(positions,id,y) - siteDistSq(positions,id,x); });
        var removed = false;
        for(var k=0; k<neighbours.length; k++){
          var nb = neighbours[k];
          if(deg(nb)<=2) continue;
          removeEdge(id, nb);
          if(!isConnectedNow()){ addEdge(id, nb); continue; }
          removed = true; changed = true;
          break;
        }
        if(!removed) break;
      }
    }
  }

  /* Rescue: any site left with only one road (a dead end you'd have to
     double back out of) picks up its nearest still-unlinked neighbour,
     skipping any candidate whose road would cross an existing one. */
  SITE_IDS.forEach(function(id){
    if(deg(id) >= 2) return;
    var ranked = SITE_IDS.filter(function(o){ return o!==id && !adj[id][o]; })
      .sort(function(x,y){ return siteDistSq(positions,id,x) - siteDistSq(positions,id,y); });
    for(var k=0; k<ranked.length; k++){
      var cand = ranked[k];
      if(deg(cand) >= softCap+1) continue;
      var crosses = edges.some(function(e){
        if(e[0]===id||e[1]===id||e[0]===cand||e[1]===cand) return false;
        return segmentsCross(positions[id],positions[cand],positions[e[0]],positions[e[1]]);
      });
      if(crosses) continue;
      addEdge(id, cand);
      break;
    }
  });

  return edges;
}
