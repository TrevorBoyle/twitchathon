function generateTravel(){
  var positions = SITE_POSITIONS;
  var travel = {};
  SITE_IDS.forEach(function(a){ travel[a]={}; });
  if(MANUAL_ROADS){
    MANUAL_ROADS.forEach(function(edge){
      var a = edge[0], b = edge[1], t = edge[2];
      travel[a][b]=t; travel[b][a]=t;
    });
    return { travel: travel, positions: positions };
  }
  var edges = generateRoadNetwork(positions);
  edges.forEach(function(edge){
    var a = edge[0], b = edge[1];
    var d = siteDist(positions, a, b);
    var t = clamp(Math.round(d * CONFIG.travelMinPerPx * randRange(1-CONFIG.travelWobble, 1+CONFIG.travelWobble)), CONFIG.travelFloor, CONFIG.travelCeiling);
    travel[a][b]=t; travel[b][a]=t;
  });
  return { travel: travel, positions: positions };
}

/* ============================== RENDERING ============================== */
var root = document.getElementById("app");

function render(){
  if(!state){ renderRegistration(); return; }
  revealedCount = state.log.length;
  /* Only the play screen has the bottom tab bar. Flag it on body so the
     credit footer can dock inside the fixed bar (see .tabbar / footer.credit
     rules) instead of sitting unreachable at the true end of the page,
     behind whatever's scrolled. Other phases keep the plain, in-flow
     footer at the bottom of their own content. */
  document.body.classList.toggle("has-tabbar", state.phase==="play");
  if(state.phase==="registration") renderRegistration();
  else if(state.phase==="camp") renderCamp();
  else if(state.phase==="end") { state.endTab==="checklist" ? renderEndChecklist() : renderEnd(); }
  else renderPlay();
  syncScrollPadding();
  saveSnapshot();
}

/* The HUD is position:sticky and the tab bar is position:fixed, so both
   float over whatever's scrolled underneath them without taking up any
   space as far as the browser's own scroll-into-view math is concerned —
   it only knows about the raw viewport, not that ~bar-height pixels of it
   are covered at the top and bottom. That made focusWatchPanel/
   focusAmbiguousPanel's scrollIntoView calls stop short, leaving the
   panel's bottom edge tucked behind the tab bar. Setting scroll-padding
   to their actual measured heights fixes that everywhere at once —
   scrollIntoView (any block mode), and even plain keyboard/anchor
   scrolling, all start treating the two bars as off-limits. */
function syncScrollPadding(){
  try{
    var hud = document.querySelector(".hud");
    var bar = document.querySelector(".tabbar");
    var topPx = hud ? Math.ceil(hud.getBoundingClientRect().height) : 0;
    var botPx = bar ? Math.ceil(bar.getBoundingClientRect().height) : 0;
    document.documentElement.style.scrollPaddingTop = topPx ? (topPx+"px") : "";
    document.documentElement.style.scrollPaddingBottom = botPx ? (botPx+"px") : "";
    /* scroll-padding only changes where scrollIntoView AIMS for — it can't
       manufacture scrollable space that doesn't exist. Early on (barely
       any log yet), the tab bar sits right after the tray with almost
       nothing between them, so a panel opening in that gap can be exactly
       as tall as the room behind the tab bar and nowhere for the page to
       scroll to clear it. Reserving that same height as bottom padding on
       #app guarantees there's always at least one tab-bar's worth of
       scroll room past the last bit of real content, so focusWatchPanel /
       focusAmbiguousPanel always have somewhere to scroll to. */
    if(root) root.style.paddingBottom = botPx ? (botPx+"px") : "";
  }catch(e){}
}

/* ---- Timed reveal: birds & events appear one at a time, in game-time order ---- */
var revealedCount = 0;
var revealTimerId = null;

/* How long a player gets to read the "something calls from cover"
   line before the What-was-that? panel interrupts with a decision —
   long enough to register what just happened, short enough not to
   feel like a stall. */
var AMBIGUOUS_POPUP_DELAY = 1400;

function revealAndRender(){
  if(revealTimerId){ clearTimeout(revealTimerId); revealTimerId = null; }
  /* This is the one place an actual game action (watching, a tea break,
     travelling, etc.) has just landed a new log entry — so it's the only
     moment we nudge the viewport toward it. Scrolled just once, here,
     rather than on every render/reveal-step, so switching tabs, toggling
     a chip, or opening/closing a panel never yanks the page around. */
  scrollLogToBottom();
  if(state.phase!=="play" || state.log.length - revealedCount <= 1){
    revealedCount = state.log.length;
    if(state.ambiguous){
      /* Show the log entry on its own for a moment first, same as the
         multi-entry reveal below, instead of popping the panel in on
         the very same frame as the message that triggered it. */
      renderAnim(revealedCount);
      revealTimerId = setTimeout(function(){ revealTimerId=null; render(); focusAmbiguousPanel(); }, AMBIGUOUS_POPUP_DELAY);
      return;
    }
    render();
    return;
  }
  stepReveal();
}

/* How long to hold on the entry just revealed before showing the next
   one. The baseline (nothing happened, already ticked, lost it, a plain
   travel/system line) is the original 580ms; everything more noteworthy
   gets a bit longer to actually land — event lines pause for a full
   second, and a confirmed sighting scales up with rarity, so a mega
   gets real room to celebrate instead of flashing past. */
function revealDelayFor(entry){
  if(!entry) return 580;
  if(entry.cls==="event") return 1000;
  if(entry.cls==="encounter" || entry.cls==="newlocation"){
    if(entry.tier==="mega") return 1400;
    if(entry.tier==="rare") return 1000;
    if(entry.tier==="uncommon") return 780;
    return 680;
  }
  return 580;
}

function stepReveal(){
  revealedCount = Math.min(revealedCount+1, state.log.length);
  renderAnim(revealedCount);
  var shown = state.log[revealedCount-1];
  if(revealedCount < state.log.length){
    revealTimerId = setTimeout(stepReveal, revealDelayFor(shown));
  } else {
    revealTimerId = setTimeout(function(){ revealTimerId=null; render(); if(state.ambiguous) focusAmbiguousPanel(); }, state.ambiguous ? AMBIGUOUS_POPUP_DELAY : 220);
  }
}

/* Native scrollIntoView (any block mode) has one blind spot: when the
   target is taller than the space actually left over once the sticky
   HUD/tab-bar padding is subtracted, "nearest" just gives up and leaves
   it aligned to whichever edge it started nearest to — which in practice
   meant the panel's title stayed put and its own action buttons (the
   part someone actually needs to tap) stayed hidden behind the tab bar.
   This does the alignment by hand instead:
   - if the panel's already fully clear of both sticky bars, do nothing.
   - if it fits in the space available, nudge it in with the minimum
     scroll (or center it, for the ambiguous panel).
   - if it's simply taller than the available space no matter what,
     favor showing its bottom edge — the buttons — over its top, since
     losing a few lines of description under the HUD costs a lot less
     than losing the ability to act on it. */
function scrollElementIntoViewSmart(el, block){
  if(!el) return;
  try{
    var rect = el.getBoundingClientRect();
    var topPad = parseFloat(document.documentElement.style.scrollPaddingTop) || 0;
    var botPad = parseFloat(document.documentElement.style.scrollPaddingBottom) || 0;
    var viewTop = topPad;
    var viewBottom = window.innerHeight - botPad;
    var available = viewBottom - viewTop;
    if(rect.top >= viewTop - 0.5 && rect.bottom <= viewBottom + 0.5) return;
    var delta;
    if(rect.height <= available){
      if(block==="center") delta = (rect.top + rect.height/2) - (viewTop + available/2);
      else delta = rect.top < viewTop ? (rect.top - viewTop) : (rect.bottom - viewBottom);
    } else {
      delta = rect.bottom - viewBottom;
    }
    if(Math.abs(delta) < 1) return;
    window.scrollBy({ top: delta, behavior: "smooth" });
  }catch(e){}
}

/* Both panels grow in with the .panelGrow keyframe (.22s) — scaleY from
   .90 to 1, translateY from -6px to 0. Measuring the panel's rect the
   instant it's inserted catches it mid-animation, smaller and higher than
   its settled size, which was quietly undershooting every scroll
   calculation below. Waiting out the animation first means we always
   measure (and scroll to) the real, final layout. */
var PANEL_GROW_MS = 240;

/* The "What was that?" decision is the one moment we deliberately pull
   focus: it's a real fork (keep searching, drop it, tea break, snack) and
   easy to miss if it lands below the fold. Centering it nudges it into
   the middle of the screen rather than jamming it flush to the top, so
   the tray buttons just above it (Tea break / Snack / Make camp — still
   live options) stay partly visible for context instead of getting
   scrolled off entirely. */
function focusAmbiguousPanel(){
  if(!state.ambiguous) return;
  setTimeout(function(){
    if(!state.ambiguous) return;
    scrollElementIntoViewSmart(document.querySelector(".ambiguous-panel"), "center");
  }, PANEL_GROW_MS);
}

/* The Watch/loop-picker panel opens right under the action tray. On a
   short screen — or if the player's mid-scroll through the log when they
   tap Watch — its bottom half (the actual options) can land below the
   fold, or the whole thing can simply be taller than what's left once the
   HUD and tab bar are accounted for. */
function focusWatchPanel(){
  setTimeout(function(){
    scrollElementIntoViewSmart(document.querySelector(".watch-panel"), "nearest");
  }, PANEL_GROW_MS);
}

function skipReveal(){
  if(revealTimerId){ clearTimeout(revealTimerId); revealTimerId = null; }
  revealedCount = state.log.length;
  render();
}

/* Newest activity renders at the top of the log. Right when a fresh batch
   of log entries starts revealing, nudge the viewport up so the player can
   see it land — but only if they're scrolled well past where it appears,
   and only once per reveal (not on every render), so this never yanks focus
   away from wherever someone is actually looking (e.g. mid-scroll reading
   the checklist, or just tapped a tab/chip that has nothing to do with the
   log at all). */
function scrollLogToBottom(){
  try{
    if(window.scrollY <= 80) return;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }catch(e){ try{ if(window.scrollY>80) window.scrollTo(0, 0); }catch(e2){} }
}

}

/* The map always renders on its own fixed dark palette regardless of the
   page's light/dark theme — this keeps roads, terrain, and markers legible
   no matter what the surrounding UI is doing, and gives the map a
   consistent, stylized identity of its own. */
var MAP_COLORS = {
  bg:            "#141d17",
  heath:         "#33482b",
  woodland:      "#233c29",
  farmland:      "#3d3520",
  wetland:       "#204039",
  coastalZone:   "#1e343c",
  ocean:         "#0f232e",
  shore:         "#3f6d82",
  roadVisited:   "#7fbf8c",
  roadHot:       "#f2b355",
  roadDash:      "#f8dfa0",
  roadSecondary: "#a3875a",
  markerCoastal: "#5ea0d6",
  markerInland:  "#63b06f",
  currentFill:   "#20351f",
  currentRing:   "#e2a35e",
  ringFull:      "#7fe08a",
  ringPartial:   "#e2a35e",
  ringEmpty:     "#4d5750",
  text:          "#eef1e6",
  textMuted:     "#a7b0a0",
  icon:          "#111611",
  iconLight:     "#f2f4ea",
  compass:       "#93a396",
  compassBg:     "#1b241d"
};

function renderMapSvg(positions, travel, highlightId, traveledEdges, remainCounts){
  var C = MAP_COLORS;
  var parts = ['<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg">'];

  /* Flat, fixed, single-colour background — never inherits the page
     theme, and no longer dressed up with terrain patches (they were
     hand-placed for the old fixed layout, drifted out of alignment once
     locations could move, and were more visual noise than signal). */
  parts.push('<rect x="0" y="0" width="700" height="440" fill="'+C.bg+'"/>');

  /* Small compass rose, purely decorative, ties the map to the birding theme. */
  parts.push('<g transform="translate(658,34)" opacity="0.75">' +
    '<circle r="17" fill="'+C.compassBg+'" stroke="'+C.compass+'" stroke-width="1"/>' +
    '<path d="M0,-11 L4,0 L0,11 L-4,0 Z" fill="'+C.compass+'"/>' +
    '<text y="-20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="'+C.compass+'">N</text>' +
  '</g>');

  /* A sparse road network, TSP-style: only real roads are drawn, each labelled,
     as gentle curves rather than ruler-straight lines. Green = already driven
     this weekend. Amber = a direct option from here, with a light dashed
     centerline to make it read as "the" road to take. Everything else is a
     muted tan secondary road — always visible against the fixed dark map. */
  if(travel){
    traveledEdges = traveledEdges || {};
    for(var i=0;i<SITE_IDS.length;i++){
      for(var j=i+1;j<SITE_IDS.length;j++){
        var a = SITE_IDS[i], b = SITE_IDS[j];
        if(!travel[a] || travel[a][b]===undefined) continue;
        var pa = positions[a], pb = positions[b];
        var visited = !!traveledEdges[[a,b].sort().join("|")];
        var hot = !visited && highlightId && (a===highlightId || b===highlightId);
        var stroke = visited ? C.roadVisited : (hot ? C.roadHot : C.roadSecondary);
        var w = visited ? 3 : (hot ? 3.5 : 2);
        var op = visited ? 0.95 : (hot ? 1 : 0.7);
        var dx=pb.x-pa.x, dy=pb.y-pa.y, len=Math.max(1,Math.sqrt(dx*dx+dy*dy));
        var nx=-dy/len, ny=dx/len;
        var bend = Math.min(26, len*0.12) * ((i+j)%2===0 ? 1 : -1);
        var cx=(pa.x+pb.x)/2+nx*bend, cy=(pa.y+pb.y)/2+ny*bend;
        var d = "M"+pa.x.toFixed(1)+","+pa.y.toFixed(1)+" Q"+cx.toFixed(1)+","+cy.toFixed(1)+" "+pb.x.toFixed(1)+","+pb.y.toFixed(1);
        parts.push('<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="'+w+'" opacity="'+op+'" stroke-linecap="round"><title>'+esc(SITES[a].name)+' ↔ '+esc(SITES[b].name)+': '+travel[a][b]+' min'+(visited?' (driven)':'')+'</title></path>');
        if(hot){
          parts.push('<path d="'+d+'" fill="none" stroke="'+C.roadDash+'" stroke-width="1" stroke-dasharray="5 6" opacity="0.6" stroke-linecap="round"/>');
        }
        var mx = 0.25*pa.x+0.5*cx+0.25*pb.x, my = 0.25*pa.y+0.5*cy+0.25*pb.y;
        var labelColor = visited ? C.roadVisited : (hot ? C.roadHot : C.textMuted);
        parts.push('<rect x="'+(mx-14).toFixed(1)+'" y="'+(my-8).toFixed(1)+'" width="28" height="13" rx="5" fill="'+C.bg+'" opacity="0.8"/>');
        if(hot){
          parts.push('<path d="M'+(mx-19).toFixed(1)+','+(my-2).toFixed(1)+' L'+(mx-15).toFixed(1)+','+my.toFixed(1)+' L'+(mx-19).toFixed(1)+','+(my+2).toFixed(1)+'" fill="none" stroke="'+C.roadHot+'" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>');
        }
        parts.push('<text x="'+mx.toFixed(1)+'" y="'+(my+2).toFixed(1)+'" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="'+labelColor+'">'+travel[a][b]+'m</text>');
      }
    }
  }

  SITE_IDS.forEach(function(id){
    var s = SITES[id], p = positions[id];
    var r = 13; /* uniform across every site, and a bit bigger than before, so the icon inside actually reads. */
    var rc = remainCounts && remainCounts[id];
    var ratio = rc && rc.total>0 ? rc.seen/rc.total : 0;
    var isCurrent = id===highlightId;

    parts.push('<g class="mapsite" data-site="'+id+'">');

    /* Progress ring — full bright green once every species here is logged,
       a partial amber arc while some are still outstanding, or a plain grey
       ring for a site not yet visited. Skipped for the current site, which
       gets its own double-ring treatment instead. */
    if(rc && !isCurrent){
      var R = r+4, circ = 2*Math.PI*R;
      parts.push('<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+R+'" fill="none" stroke="'+C.ringEmpty+'" stroke-width="2" opacity="0.6"/>');
      if(ratio>0){
        var dash = (circ*Math.min(1,ratio)).toFixed(1);
        var ringColor = ratio>=1 ? C.ringFull : C.ringPartial;
        parts.push('<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+R+'" fill="none" stroke="'+ringColor+'" stroke-width="2" stroke-linecap="round" stroke-dasharray="'+dash+' '+circ.toFixed(1)+'" transform="rotate(-90 '+p.x.toFixed(1)+' '+p.y.toFixed(1)+')"/>');
      }
    }

    var iconColor = C.icon;
    if(isCurrent){
      parts.push('<circle class="pulse-ring" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(r+5)+'" fill="none" stroke="'+C.currentRing+'" stroke-width="2.5"/>');
      parts.push('<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(r+1)+'" fill="none" stroke="'+C.currentRing+'" stroke-width="1" opacity="0.6"/>');
      parts.push('<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+'" fill="'+C.currentFill+'" stroke="'+C.currentRing+'" stroke-width="1"/>');
      iconColor = C.iconLight;
    } else {
      var fill = s.zone==="coastal" ? C.markerCoastal : C.markerInland;
      parts.push('<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+'" fill="'+fill+'"'+(s.hide?' stroke="'+C.icon+'" stroke-width="1"':'')+'/>');
    }
    parts.push(siteIconMarkup(siteIconKind(s), p.x, p.y, r/5, iconColor));
    var labelX = (p.x+r+6).toFixed(1);
    var nameWeight = isCurrent?"700":"400";
    /* Uppercase, monospaced, and a touch of letter-spacing so the map
       labels read like a typewritten gazetteer rather than page prose —
       every current name is short enough to sit comfortably on one line. */
    parts.push('<text x="'+labelX+'" y="'+(p.y+3.5).toFixed(1)+'" font-family="JetBrains Mono, monospace" font-size="10.5" letter-spacing="0.5" font-weight="'+nameWeight+'" fill="'+C.text+'">'+esc(s.name.toUpperCase())+'</text>');
    if(rc){
      parts.push('<text x="'+labelX+'" y="'+(p.y+13.5).toFixed(1)+'" font-family="JetBrains Mono, monospace" font-size="8.5" fill="'+C.textMuted+'" opacity="0.9">'+rc.seen+'/'+rc.total+'</text>');
    }
    if(!isCurrent && travel){
      var shortest = shortestPath(highlightId, id);
      if(shortest){
        var total = 0;
        for(var k=1;k<shortest.length;k++){ total += travel[shortest[k-1]][shortest[k]]; }
        var viaNote = shortest.length>2 ? ' via '+(shortest.length-2)+' stop'+(shortest.length-2===1?'':'s') : '';
        parts.push('<title>Drive to '+esc(s.name)+' — '+total+' min'+viaNote+'</title>');
      }
    }
    parts.push('</g>');
  });
  parts.push('</svg>');
  return parts.join("");
}

function renderTravelTable(travel){
  var rows = [];
  SITE_IDS.forEach(function(a){
    var neighbors = SITE_IDS.filter(function(b){ return b!==a && travel[a] && travel[a][b]!==undefined; })
      .sort(function(x,y){ return travel[a][x]-travel[a][y]; });
    if(!neighbors.length) return;
    rows.push('<tr><th>'+esc(SITES[a].name)+'</th><td>'+neighbors.map(function(b){ return esc(SITES[b].name)+' <span class="mono muted">('+travel[a][b]+'m)</span>'; }).join(', ')+'</td></tr>');
  });
  return '<table><tr><th>Site</th><th>Direct roads to</th></tr>'+rows.join("")+'</table>';
}

function startGame(){
  state = freshState();
  /* Re-snapshot at the top of every game, not just on page load — covers
     "Play again" without a full reload picking up a stale count/list. */
  LIFE_LIST_SNAPSHOT = getLifeListStore();
  GAMES_PLAYED_BEFORE = getGamesPlayedCount();
  state.teamName = regDraft.teamName.trim() || pick(RANDOM_TEAM_NAMES);
  state.costs = regDraft.costs;
  state.travel = regDraft.travel;
  state.positions = regDraft.positions;
  state.loadout = {
    binoculars: regDraft.binoculars, snackPacks: regDraft.snackPacks, scope: regDraft.scope, fieldGuide: regDraft.fieldGuide,
    weatherproof: regDraft.weatherproof, parabolicMic: regDraft.parabolicMic,
    skill: regDraft.skill,
    youngEyes: regDraft.skill==="youngEyes", twitchersNose: regDraft.skill==="twitchersNose",
    ironConstitution: regDraft.skill==="ironConstitution", backroads: regDraft.skill==="backroads"
  };
  state.snackBars = regDraft.snackPacks * CONFIG.snackPackSize;
  var bino = CONFIG.binoculars[regDraft.binoculars];
  state.binocDet = bino.det + (state.loadout.youngEyes ? CONFIG.youngEyes.detBonus : 0);
  state.binocId = bino.id;
  state.fatigueMult = state.loadout.ironConstitution ? CONFIG.ironConstitution.mult : 1;
  RIVAL_DEFS.forEach(function(r){
    state.rivals.skills[r.key] = pick(SKILL_DEFS).key;
    /* Rivals shop too, off-screen — a randomised loadout gives each one a
       little extra texture and means gear-driven events land on them the
       same way they'd land on the player. */
    var binoRoll = rnd();
    state.rivals.gear[r.key] = {
      binoculars: binoRoll<0.20 ? "premium" : (binoRoll<0.65 ? "mid" : "none"),
      scope: rnd()<0.40,
      fieldGuide: rnd()<0.35,
      weatherproof: rnd()<0.30,
      parabolicMic: rnd()<0.25
    };
  });
  RIVAL_DEFS.forEach(function(r){ state.rivals.smart[r.key] = createSmartBot(r.key); });
  state.phase = "play";
  rollWeather();
  addLog("First light at " + SITES[state.currentSite].name + ". “" + esc(state.teamName) + "” roll out at 4:30am.", "system");
  regDraft = null;
  render();
}

/* ---- Play screen ---- */
function renderPlay(){
  simulateRivals(state.clock);
  var body = state.tab==="checklist" ? renderChecklistTab() : (state.tab==="travel" ? renderTravelTab() : renderActivityTab());
  root.innerHTML = body + renderTabBar();

  var tabActivity = document.getElementById("tabActivity");
  var tabTravel = document.getElementById("tabTravel");
  var tabChecklist = document.getElementById("tabChecklist");
  if(tabActivity) tabActivity.addEventListener("click", function(){ state.tab="activity"; render(); });
  if(tabTravel) tabTravel.addEventListener("click", function(){ state.tab="travel"; render(); });
  if(tabChecklist) tabChecklist.addEventListener("click", function(){ state.tab="checklist"; render(); });

  if(state.tab==="activity"){
    var btnWatch = document.getElementById("btnWatch");
    if(btnWatch) btnWatch.addEventListener("click", function(){
      state.hasWatchedOnce = true;
      var opening = state.sheet!=="watch";
      state.sheet = opening ? "watch" : null;
      render();
      /* Only nudge the viewport when the panel is actually opening — not
         when this same click is the one that closes it back up. */
      if(opening) focusWatchPanel();
    });
    var btnTea = document.getElementById("btnTea");
    if(btnTea) btnTea.addEventListener("click", doTeaBreak);
    var btnSnack = document.getElementById("btnSnack");
    if(btnSnack) btnSnack.addEventListener("click", eatSnack);
    var campBtn = document.getElementById("btnCamp");
    if(campBtn) campBtn.addEventListener("click", enterCamp);
    var textBtn = document.getElementById("btnTextIn");
    if(textBtn) textBtn.addEventListener("click", attemptTextIn);
    attachPanelHandlers();
    /* Clicking the current-location name in the HUD jumps to the Travel
       tab, same as the tab button itself — a quiet convenience for anyone
       who instinctively clicks the place name rather than the tab. No
       hover/underline styling on purpose: the Travel tab button remains
       the visible, intended way to get there. */
    var hudLocationName = document.getElementById("hudLocationName");
    if(hudLocationName && !state.ambiguous) hudLocationName.addEventListener("click", function(){ state.tab="travel"; render(); });
  }
  if(state.tab==="travel") attachTravelTabHandlers();
  if(state.tab==="checklist"){
    var viewRarityBtn = document.getElementById("viewRarityBtn");
    var viewLocationBtn = document.getElementById("viewLocationBtn");
    if(viewRarityBtn) viewRarityBtn.addEventListener("click", function(){ state.checklistView="rarity"; render(); });
    if(viewLocationBtn) viewLocationBtn.addEventListener("click", function(){ state.checklistView="location"; render(); });
  }
  if(state.ambiguous) attachAmbiguousHandlers();
}

/* ---- Activity tab: status, live odds, action row + inline panel, feed ---- */
function renderActivityTab(){
  var site = activeSite();
  var tier = energyTier(state.energy);
  var wIdx = windowIndex(state.clock);
  var windowName = CONFIG.windows[wIdx];
  var speciesCount = distinctConfirmedCount();
  var bestScore = getBestScore();
  var odds = oddsSnapshot();
  var siteRc = siteRemainingCounts()[site.id] || { seen:0, total:0, remaining:0 };

  var alerts = state.activeEffects.map(function(e){
    if(e.type==="rareAlert") return '<span class="alert-pill">Alert: '+esc(e.label)+'</span>';
    if(e.type==="localTip") return '<span class="alert-pill">Tip: '+esc(e.label)+'</span>';
    if(e.type==="coldFront") return '<span class="alert-pill">'+esc(e.label)+'</span>';
    if(e.type==="dewy") return '<span class="alert-pill">Fogged optics</span>';
    if(e.type==="magpie") return '<span class="alert-pill">Distracted</span>';
    if(e.type==="goldenLight") return '<span class="alert-pill">Perfect light</span>';
    if(e.type==="windPickup") return '<span class="alert-pill">Windy</span>';
    if(e.type==="gearFumble") return '<span class="alert-pill">Fumbled gear</span>';
    if(e.type==="luckyBreak") return '<span class="alert-pill">Lucky break ready</span>';
    return "";
  }).filter(Boolean).join("");
  if(state.roadworksPending>0) alerts += '<span class="alert-pill">Roadworks ahead</span>';

  var visibleLog = state.log.slice(-CONFIG.activityFeedLimit);
  var hiddenCount = state.log.length - visibleLog.length;

  return '<div class="tabpage sky-'+wIdx+'">' +
    '<div class="hud'+((state.weatherMult||1)<0.95?" wx-poor":"")+'">' +
      '<div class="hud-left"><span class="clock mono">'+fmtClock(state.clock)+'</span><span class="site"><span class="loc-label">Current Location: </span><span id="hudLocationName">'+esc(site.name)+(state.campSiteId===state.currentSite?" (camp)":"")+'</span> <span class="muted mono" style="font-size:.78em">'+siteRc.seen+'/'+siteRc.total+'</span></span></div>' +
      '<div class="hud-mid">' +
        '<div class="ebar-track"><div class="ebar-fill" style="width:'+state.energy+'%;background:var(--'+tier.tone+')"></div></div>' +
        '<span class="mono" style="font-size:.8rem">'+Math.round(state.energy)+(state.energyCeiling<100 ? "/"+state.energyCeiling : "")+' &middot; '+tier.name+'</span>' +
      '</div>' +
      '<div class="hud-right">' +
        '<span><span class="k">Species</span><span class="val hero">'+speciesCount+'</span></span>' +
        '<span><span class="k">Snacks</span><span class="val">'+state.snackBars+'</span></span>' +
        '<span><span class="k">'+windowName+'</span><span class="val">'+esc(state.weatherLabel||"")+'</span></span>' +
        (state.day==="Sunday" ? '<span><span class="k">Deadline</span><span class="val'+(Math.max(0,CONFIG.deadline-state.clock)<=90?" warn":"")+'">'+Math.max(0,CONFIG.deadline-state.clock)+'m</span></span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="rivalbar">' +
      '<span class="rivalbar-label">Team Scores:</span>' +
      '<span>'+esc(state.teamName)+' (You) <b>'+speciesCount+'</b></span>' +
      RIVAL_DEFS.map(function(r){ return '<span>'+esc(r.name)+' <b>'+state.rivals.counts[r.key]+'</b></span>'; }).join("") +
      (bestScore!==null ? '<span class="pb">Your best: '+bestScore+'</span>' : '') +
    '</div>' +
    (odds ?
      '<div class="oddsbar">' +
        '<div class="oddsbar-line"><span class="oname">Chance of detecting something new</span><span class="opct">'+Math.round(odds.detectPct*100)+'%</span></div>' +
        (odds.detectMods.length ? '<div class="oddsbar-mods">'+renderModChips(odds.detectMods)+'</div>' : '') +
        '<div class="oddsbar-line"><span class="oname">Chance of identifying detected birds</span><span class="opct">'+Math.round(odds.idPct*100)+'%</span></div>' +
        (odds.idMods.length ? '<div class="oddsbar-mods">'+renderModChips(odds.idMods)+'</div>' : '') +
      '</div>'
      : '<div class="oddsbar muted">Everything left here for this visit is already ticked off.</div>') +
    (alerts ? '<div class="alerts">'+alerts+'</div>' : '') +
    (state.log.length<=1 ? '<div class="onboard-hint">New here? Hit <strong>Go Birding</strong> below to start watching. Each watch has a chance of turning up a species, which you then have to <strong>identify</strong> before it counts. Not sure what a spot has got? Check the <strong>Checklist</strong> tab for who&rsquo;s around, or the <strong>Travel</strong> tab to move on somewhere else. Confirmed species build your list until the deadline. Most species, not most sightings, wins.</div>' : '') +
    '<div class="tray-wrap"><div class="tray">' +
      '<button id="btnWatch" class="primary'+(state.hasWatchedOnce?"":" glow-cta")+'" '+(state.ambiguous?"disabled":"")+'>Go Birding</button>' +
      '<button id="btnTea" '+(state.ambiguous?"disabled":"")+'>Tea break'+(nextTeaBreakGain()>0 ? " (+"+nextTeaBreakGain()+")" : (state.energyCeiling<100 ? " (capped)" : " (full)"))+'</button>' +
      '<button id="btnSnack" '+(state.snackBars<=0||state.ambiguous?"disabled":"")+'>Snack</button>' +
      (state.day==="Saturday" ? '<button id="btnCamp" class="'+(cutoffLooming()?"glow-cutoff":"")+'" '+((state.ambiguous||minuteOfDay(state.clock)<CONFIG.campEarliestMinuteOfDay)?"disabled":"")+'>Make camp</button>' : '<button class="warn'+(cutoffLooming()?" glow-cutoff":"")+'" id="btnTextIn" '+((state.ambiguous||minuteOfDay(state.clock)<CONFIG.callItAWeekendEarliestMinuteOfDay)?"disabled":"")+'>Call it a weekend</button>') +
    '</div></div>' +
    renderInlinePanel() +
    (hiddenCount>0 ? '<p class="muted" style="padding:0 16px 6px;font-size:.8rem;">Showing the last '+visibleLog.length+' entries &middot; '+hiddenCount+' earlier this weekend.</p>' : '') +
    '<div class="log" id="logPane">' + visibleLog.slice().reverse().map(function(e,i){ return renderLogEntry(e, i===0); }).join("") + '</div>' +
  '</div>';
}

/* ---- Checklist tab: the full collection view, now a persistent destination ---- */
function renderChecklistTab(){
  var gotNames = SPECIES_ROSTER.filter(function(e){ return e.ids.some(function(id){ return state.confirmed[id]; }); }).length;
  var viewToggle = '<div class="radiogrp" style="margin-bottom:10px;">' +
      '<button class="chip '+(state.checklistView==="location"?"":"active")+'" id="viewRarityBtn">By rarity</button>' +
      '<button class="chip '+(state.checklistView==="location"?"active":"")+'" id="viewLocationBtn">By location</button>' +
    '</div>';
  var body = state.checklistView==="location" ? renderChecklistByLocation() : renderChecklist();
  return '<div class="tabpage" style="padding-top:16px;">' +
    '<div style="padding:0 16px;">' +
      '<h3 style="font-family:\'JetBrains Mono\',monospace;font-size:1.3rem;margin-bottom:4px;">Checklist</h3>' +
      '<p class="sub" style="color:var(--ink-soft);font-size:.85rem;margin-bottom:14px;">'+gotNames+' of '+SPECIES_ROSTER.length+' species confirmed.</p>' +
      viewToggle +
    '</div>' +
    '<div style="padding:0 16px;">' + body + '</div>' +
  '</div>';
}

/* Once time-on-site has run long enough that this site's odds have really
   faded (scaled by how much ground the site has), the Travel tab starts
   pulsing the same way "Go Birding" does — a nudge that moving on is
   probably worth it now. */
function travelPulseDue(){
  if(state.tab==="travel") return false;
  var site = activeSite();
  var thresh = CONFIG.travelPulseMinutesBySize[site.size] || CONFIG.travelPulseMinutesBySize.standard;
  return state.minutesOnSite >= thresh;
}

/* Small line icons for the bottom tab bar — a magnifying glass for
   watching, a map pin for travel, a clipboard for the checklist — so
   the three destinations read at a glance rather than as three
   same-weight text labels. */
function tabIcon(kind){
  if(kind==="activity") return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20 L15.2 15.2"/></svg>';
  if(kind==="travel") return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 C12 21 5 13.3 5 8.4 A7 7 0 0 1 19 8.4 C19 13.3 12 21 12 21 Z"/><circle cx="12" cy="8.4" r="2.4"/></svg>';
  if(kind==="checklist") return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 3 L8.5 5 L15.5 5 L15.5 3"/><path d="M8.5 10 L15.5 10 M8.5 13.5 L15.5 13.5 M8.5 17 L12.5 17"/></svg>';
  return '';
}

function renderTabBar(){
  var speciesCount = distinctConfirmedCount();
  var pulseTravel = travelPulseDue();
  /* The tab row and the credit line are one fixed unit (see .tabbar in
     the stylesheet) so the "Created by" line rides along directly under
     the tabs instead of sitting at the true end of the page, wherever
     that happens to be, behind the fixed bar. The standalone <footer> in
     the static markup covers every other phase (registration/camp/end),
     which has no tab bar to dock under. */
  return '<div class="tabbar">' +
    '<div class="tabbar-row">' +
      '<button class="tabbtn tab-activity '+(state.tab==="activity"?"active":"")+'" id="tabActivity">'+tabIcon("activity")+'<span>Activity</span></button>' +
      '<button class="tabbtn tab-travel '+(state.tab==="travel"?"active":"")+(pulseTravel?" glow-travel":"")+'" id="tabTravel" '+(state.ambiguous?"disabled":"")+'>'+tabIcon("travel")+'<span>Travel</span></button>' +
      '<button class="tabbtn tab-checklist '+(state.tab==="checklist"?"active":"")+'" id="tabChecklist" '+(state.ambiguous?"disabled":"")+'>'+tabIcon("checklist")+'<span>Checklist</span><span class="tcount">'+speciesCount+'/'+SPECIES_ROSTER.length+'</span></button>' +
    '</div>' +
    '<div class="tabbar-credit">Created by <a href="https://www.linkedin.com/in/trevorboyle/" target="_blank" rel="noopener noreferrer">Trevor Boyle</a></div>' +
  '</div>';
}

/* ---- Animated frame shown while sightings are being revealed one at a time ---- */
function renderAnim(count){
  var upto = state.log[count-1];
  var eVal = upto ? upto.energy : Math.round(state.energy);
  var cVal = upto ? upto.clock : state.clock;
  var sVal = upto ? upto.species : distinctConfirmedCount();
  var tier = energyTier(eVal);
  var site = activeSite();
  root.innerHTML =
    '<div class="hud">' +
      '<div class="hud-left"><span class="clock mono">'+fmtClock(cVal)+'</span><span class="site"><span class="loc-label">Current Location: </span>'+esc(site.name)+'</span></div>' +
      '<div class="hud-mid">' +
        '<div class="ebar-track"><div class="ebar-fill" style="width:'+eVal+'%;background:var(--'+tier.tone+')"></div></div>' +
        '<span class="mono" style="font-size:.8rem">'+eVal+(state.energyCeiling<100 ? "/"+state.energyCeiling : "")+' &middot; '+tier.name+'</span>' +
      '</div>' +
      '<div class="hud-right"><span><span class="k">Species</span><span class="val hero">'+sVal+'</span></span></div>' +
    '</div>' +
    '<div class="log" id="logPane">' + state.log.slice(0,count).slice().reverse().map(function(e,i){ return renderLogEntry(e, i===0); }).join("") + '</div>' +
    '<div class="tray-wrap"><div class="anim-tray"><button class="ghost" id="skipReveal">Skip ahead &raquo;</button></div></div>';
  var skipBtn = document.getElementById("skipReveal");
  if(skipBtn) skipBtn.addEventListener("click", skipReveal);
}

function renderLogEntry(e, isNew){
  var tierCls = (e.tier && (e.cls==="encounter"||e.cls==="newlocation")) ? " tier-"+e.tier : "";
  /* Ballot-box tick marks an actual sighting going onto the list this
     visit — confirmed encounters and first-at-this-site ticks both
     count, a repeat "already on the list" line doesn't. */
  var isSighting = e.cls==="encounter" || e.cls==="newlocation";
  var tickIcon = isSighting ? '<span class="tick-icon" aria-hidden="true">&#9745;</span>' : "";
  return '<div class="entry '+e.cls+tierCls+(isNew?" reveal":"")+'"><span class="ts">'+e.ts+'</span><span class="txt">'+tickIcon+e.txt+'</span></div>';
}

/* Used to be a full-screen sheet that cut in over everything the instant
   an ID went ambiguous — jarring, and it blocked the rest of the screen
   for no real reason. Now it grows open in the same inline slot the loop
   picker uses, right under the action tray, so it reads as part of the
   activity feed rather than an interruption. */
function renderAmbiguousPanel(){
  var amb = state.ambiguous;
  var cooked = energyTier(state.energy).name==="Cooked";
  var spx = findSpecies(amb.speciesId);
  return '<div class="inlinepanel ambiguous-panel">' +
    '<h3>What was that?</h3>' +
    '<p class="sub">It could possibly be a '+esc(spx.name)+', but you&rsquo;re not sure&hellip;</p>' +
    '<p class="sub">'+CONFIG.keepLookingTime+' minutes and '+keepLookingEnergyCost()+' energy per extra look &mdash; attempt <span class="attempt-badge">'+(amb.attempts+1)+'</span></p>' +
    '<div class="optlist">' +
      '<button class="optbtn" id="ambKeep" '+(cooked?"disabled":"")+'><span class="oname">Keep searching</span><span class="ometa">+time, better odds, risk of scaring it away</span></button>' +
      '<button class="optbtn" id="ambLog"><span class="oname">Ignore and move on</span><span class="ometa">no credit, banked as a mystery</span></button>' +
      '<button class="optbtn" id="ambTea"><span class="oname">Tea break here</span><span class="ometa">'+(nextTeaBreakGain()>0 ? "ends the chase, +"+nextTeaBreakGain()+" energy" : (state.energyCeiling<100 ? "ends the chase, already at your capped max" : "ends the chase, already topped up"))+'</span></button>' +
      '<button class="optbtn" id="ambSnack" '+(state.snackBars<=0?"disabled":"")+'><span class="oname">Snack</span><span class="ometa">ends the chase, +'+CONFIG.snackRestore+' energy, no time</span></button>' +
    '</div>' +
  '</div>';
}

function attachAmbiguousHandlers(){
  var ambKeep = document.getElementById("ambKeep");
  var ambLog = document.getElementById("ambLog");
  var ambTea = document.getElementById("ambTea");
  var ambSnack = document.getElementById("ambSnack");
  if(ambKeep) ambKeep.addEventListener("click", resolveKeepLooking);
  if(ambLog) ambLog.addEventListener("click", logItAndMoveOn);
  if(ambTea) ambTea.addEventListener("click", doTeaBreak);
  if(ambSnack) ambSnack.addEventListener("click", eatSnack);
}

/* ---- Inline action panel (Watch) — expands in place under the action
   row on the Activity tab, rather than opening a full overlay. ---- */
function renderInlinePanel(){
  if(state.ambiguous) return renderAmbiguousPanel();
  if(state.sheet==="watch") return renderWatchPanel();
  return "";
}

var LOOP_LABELS = { quick:"Quick loop", short:"Short loop", medium:"Medium loop", long:"Long loop", extended:"Extra long loop" };

/* Which loop lengths this particular site offers — an explicit per-site
   menu where one exists, falling back to a generic by-size default. This
   is what gives the walk on offer real variety place to place, instead of
   a flat short/long choice everywhere. */
function getLoopOptions(site){
  return CONFIG.siteLoopOptions[site.id] || CONFIG.loopOptionsBySize[site.size] || ["short","long"];
}

function renderWatchPanel(){
  var site = activeSite();
  var mode = site.hide ? (state.watchMode==="walk" ? "walk" : "hide") : "walk";
  var multiLoop = getLoopOptions(site).length > 1;
  var modeNote = site.hide
    ? '<p class="sub">This site has a hide. Sit and watch in steady half-hour stretches. On foot, you walk the loop to cover more ground. Once you set off, you\'re in for the whole thing.</p>'
    : '<p class="sub">On foot is the only way to work this site. '+(multiLoop ? "Pick a loop" : "The loop here is fixed")+'; once you set off, you\'re in for the whole thing.</p>';
  var toggle = site.hide
    ? '<div class="optlist"><div class="grid2"><button id="modeHide" class="'+(mode!=="walk"?"modebtn-active":"")+'">From the hide</button><button id="modeWalk" class="'+(mode==="walk"?"modebtn-active":"")+'">On foot</button></div></div>'
    : '';
  var actionHtml;
  if(mode==="hide"){
    var hideCrosses = wouldCrossCutoff(CONFIG.hideSearch.minutes);
    var hideMeta = CONFIG.hideSearch.minutes+' min'+(hideCrosses?' &middot; runs past '+cutoffLabel():'');
    actionHtml = '<div class="optlist"><button class="optbtn" id="doSearch" '+(hideCrosses?"disabled":"")+'><span class="oname">Go Birding</span><span class="ometa">'+hideMeta+'</span></button></div>';
  } else {
    var loopKeys = getLoopOptions(site);
    var loopBtns = loopKeys.map(function(key, i){
      var cfg = CONFIG.loop[key];
      var label = loopKeys.length===1 ? "Walk the loop" : (LOOP_LABELS[key] || key);
      /* The exact number, not a bucketed phrase — "much better odds" was
         landing on both the Long (+18%) and Full (+32%) loop and reading
         as if they were the same choice. Every option's actual odds bonus
         is now spelled out, so two loops with different bonuses always
         read differently. */
      var pct = Math.round((cfg.bonus-1)*100);
      var metaExtra = pct>0 ? " &middot; +"+pct+"% odds, more ground covered"
        : pct<0 ? " &middot; "+pct+"% odds, quicker"
        : " &middot; baseline odds";
      /* Can't set off on a loop that wouldn't be finished before today's
         hard cutoff — better to make camp (Saturday) or call it a weekend
         (Sunday) than get cut off mid-walk. */
      var crosses = wouldCrossCutoff(cfg.minutes);
      if(crosses) metaExtra += " &middot; runs past " + cutoffLabel();
      return '<button class="optbtn" data-loop="'+key+'" '+(crosses?"disabled":"")+'><span class="oname">'+label+'</span><span class="ometa">'+cfg.minutes+' min'+metaExtra+'</span></button>';
    }).join("");
    actionHtml = '<div class="optlist">' + loopBtns + '</div>';
  }
  return '<div class="inlinepanel watch-panel">' +
    '<h3>'+(site.hide?"Watch or go birding?":"Which loop?")+'</h3>' + modeNote + toggle + actionHtml +
    '<button class="ghost block" id="panelClose">Cancel</button>' +
  '</div>';
}

/* ---- Travel tab: the map comes up automatically, roads out of the
   current site, and (behind a toggle) the full pairwise travel table. ---- */
function renderTravelTab(){
  var siteCounts = siteRemainingCounts();
  var locByLabel = locationCountsByLabel();
  var zoneBlock = "";
  if(state.currentSite==="ninetymile"){
    var zoneOpts = SITES.ninetymile.zones.filter(function(z){ return z.id!==state.currentZone; }).map(function(z){
      var zc = locByLabel[SITES.ninetymile.name+" — "+z.name] || {remaining:0,total:0};
      var zoneCrosses = wouldCrossCutoff(20);
      return '<button class="optbtn" data-zone="'+z.id+'" '+(zoneCrosses?"disabled":"")+'><span class="oname">'+esc(z.name)+' <span class="muted mono" style="font-size:.78em">'+zc.seen+'/'+zc.total+'</span></span><span class="ometa">~20 min on foot'+(zoneCrosses?' &middot; runs past '+cutoffLabel():'')+'</span></button>';
    }).join("");
    zoneBlock = '<div style="padding:0 16px;"><p class="sub" style="margin-top:0">Within the reserve:</p><div class="optlist">'+zoneOpts+'</div></div>';
  }
  var travelOpts = SITE_IDS.filter(function(id){ return id!==state.currentSite && state.travel[state.currentSite][id]!==undefined; }).map(function(id){
    var s = SITES[id];
    var t = state.travel[state.currentSite][id];
    var rc = siteCounts[id] || {remaining:0,total:0};
    var raptorNote = roadsideRaptorChance(t)>=0.08 ? ' &middot; raptor country' : '';
    /* Can't set off on a drive that wouldn't get you there before today's
       hard cutoff. */
    var crosses = wouldCrossCutoff(t);
    var travelMeta = t+' min'+raptorNote+(crosses?' &middot; runs past '+cutoffLabel():'');
    return '<button class="optbtn" data-travel="'+id+'" '+(crosses?"disabled":"")+'><span class="oname">'+esc(s.name)+' <span class="muted mono" style="font-size:.78em">'+rc.seen+'/'+rc.total+'</span></span><span class="ometa">'+travelMeta+'</span></button>';
  }).join("");
  var tableBlock = state.travelTableOpen ? '<div class="tblwrap" style="margin-top:10px">'+renderTravelTable(state.travel)+'</div>' : '';
  var guideBlock = state.siteGuideOpen ? '<div style="margin-top:10px">'+renderSiteGuide(siteCounts)+'</div>' : '';

  return '<div class="tabpage" style="padding-top:16px;">' +
    '<div style="padding:0 16px;">' +
      '<h3 style="font-family:\'JetBrains Mono\',monospace;font-size:1.3rem;margin-bottom:4px;">Where to?</h3>' +
      '<p class="sub" style="color:var(--ink-soft);font-size:.85rem;margin-bottom:12px;">Roads out of '+esc(SITES[state.currentSite].name)+' in amber. Green marks the ground you&rsquo;ve already covered this weekend. Numbers by each name are species you&rsquo;ve already logged there.</p>' +
    '</div>' +
    '<div class="mapwrap" style="margin:0 16px 14px">'+renderMapSvg(state.positions, state.travel, state.currentSite, state.traveledEdges, siteCounts)+'</div>' +
    zoneBlock +
    '<div style="padding:0 16px;">' +
      '<p class="sub" style="margin-top:0">Direct roads from here; anywhere else means passing through one of these first:</p>' +
      '<div class="optlist">'+travelOpts+'</div>' +
      '<button class="ghost block" id="toggleTravelTable">'+(state.travelTableOpen?"Hide full travel times":"Show full travel times")+'</button>' +
      '<button class="ghost block" id="toggleSiteGuide" style="margin-top:6px">'+(state.siteGuideOpen?"Hide site guide":"Show site guide (what&rsquo;s at each spot)")+'</button>' +
      tableBlock +
      guideBlock +
    '</div>' +
  '</div>';
}

/* Full site directory — name, size, and the blurb that used to live on the
   registration screen, now that the map there is gone. Sorted by distance
   from wherever the player currently is, so "worth the drive?" is an easy
   scan. */
function renderSiteGuide(siteCounts){
  var rows = SITE_IDS.slice().sort(function(a,b){
    var ta = state.travel[state.currentSite][a], tb = state.travel[state.currentSite][b];
    if(a===state.currentSite) return -1;
    if(b===state.currentSite) return 1;
    return (ta===undefined?9999:ta) - (tb===undefined?9999:tb);
  }).map(function(id){
    var s = SITES[id];
    var rc = siteCounts[id] || { seen:0, total:0 };
    var here = id===state.currentSite;
    var t = state.travel[state.currentSite][id];
    var distNote = here ? "you're here" : (t!==undefined ? t+" min direct" : "no direct road");
    return '<div class="sitecard" style="padding:10px 0;border-bottom:1px solid var(--line)">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">' +
        '<strong>'+esc(s.name)+'</strong>' +
        '<span class="muted mono" style="font-size:.78em;white-space:nowrap">'+rc.seen+'/'+rc.total+' &middot; '+distNote+'</span>' +
      '</div>' +
      '<div style="font-size:.8rem;color:var(--ink-soft);margin-top:2px">'+esc(s.blurb)+'</div>' +
    '</div>';
  }).join("");
  return '<div class="tblwrap">'+rows+'</div>';
}

function renderChecklist(){
  var tierLabel = { mega:"Mega", rare:"Rare", uncommon:"Uncommon", common:"Common" };
  var order = ["common","uncommon","rare","mega"];
  var byTier = { mega:[], rare:[], uncommon:[], common:[] };
  SPECIES_ROSTER.forEach(function(entry){ byTier[entry.tier].push(entry); });
  return order.map(function(tier){
    var list = byTier[tier];
    if(!list.length) return "";
    var confirmedCount = 0;
    var rows = list.map(function(entry){
      var confirmedDetail = null;
      for(var i=0;i<entry.ids.length;i++){ if(state.confirmed[entry.ids[i]]){ confirmedDetail = state.confirmed[entry.ids[i]]; break; } }
      var tierCls = tier==="mega"?"pill mega":(tier==="rare"?"pill rare":"pill");
      if(confirmedDetail){
        confirmedCount++;
        var seenNote = confirmedDetail.firstSeenDate ? ' <span class="seen-note">Seen: '+formatOrdinalDate(confirmedDetail.firstSeenDate)+'</span>' : '';
        return '<li class="muted"><span class="struck">'+esc(entry.name)+'</span>'+(confirmedDetail.audio?' <span style="font-size:.75em">(heard)</span>':'')+' &middot; '+esc(confirmedDetail.siteName)+', '+confirmedDetail.at+seenNote+' <span class="'+tierCls+'" style="opacity:.6">'+tier+'</span></li>';
      }
      var siteHint = entry.sites.length>3 ? entry.sites.slice(0,3).join(", ")+" &amp; "+(entry.sites.length-3)+" more" : entry.sites.join(", ");
      var gateNote = entry.gate==="nocturnal" ? " &mdash; after dark only" : "";
      var priorSeen = LIFE_LIST_SNAPSHOT[entry.name] ? ' <span class="seen-note">Seen: '+formatOrdinalDate(LIFE_LIST_SNAPSHOT[entry.name])+'</span>' : '';
      return '<li><strong>'+esc(entry.name)+'</strong> &mdash; '+siteHint+gateNote+priorSeen+' <span class="'+tierCls+'">'+tier+'</span></li>';
    }).join("");
    return '<div class="lifelist-group"><h4>'+tierLabel[tier]+' &middot; '+confirmedCount+'/'+list.length+'</h4><ul class="plain">'+rows+'</ul></div>';
  }).join("");
}

/* ---- By-location checklist view: groups species by site/zone label
   (same granular labels used for site hints), ranked by how many
   unconfirmed species are still outstanding there. ---- */
function buildLocationSummary(){
  var byLoc = {};
  SPECIES_ROSTER.forEach(function(entry){
    var confirmedDetail = null;
    for(var i=0;i<entry.ids.length;i++){ if(state.confirmed[entry.ids[i]]){ confirmedDetail = state.confirmed[entry.ids[i]]; break; } }
    entry.sites.forEach(function(loc){
      if(!byLoc[loc]) byLoc[loc] = { name: loc, rows: [], remaining: 0 };
      byLoc[loc].rows.push({ entry: entry, confirmedDetail: confirmedDetail });
      if(!confirmedDetail) byLoc[loc].remaining++;
    });
  });
  return Object.keys(byLoc).map(function(k){ return byLoc[k]; }).sort(function(a,b){
    if(b.remaining!==a.remaining) return b.remaining-a.remaining;
    return a.name<b.name ? -1 : (a.name>b.name ? 1 : 0);
  });
}

/* Location-summary rows keyed by their label, for quick X/Y lookups
   (travel list, map) without re-deriving the summary each time. */
function locationCountsByLabel(){
  var byLabel = {};
  buildLocationSummary().forEach(function(loc){
    var total = loc.rows.length;
    byLabel[loc.name] = { seen: total - loc.remaining, remaining: loc.remaining, total: total };
  });
  return byLabel;
}

/* Same counts, rolled up to one entry per top-level site (a large site's
   zones are summed together) — what the map and travel list key off of. */
function siteRemainingCounts(){
  var byLabel = locationCountsByLabel();
  var out = {};
  SITE_IDS.forEach(function(id){
    var s = SITES[id];
    if(s.zones){
      var remaining = 0, total = 0, seen = 0;
      s.zones.forEach(function(z){
        var loc = byLabel[s.name+" — "+z.name];
        if(loc){ remaining += loc.remaining; total += loc.total; seen += loc.seen; }
      });
      out[id] = { remaining: remaining, total: total, seen: seen };
    } else {
      out[id] = byLabel[s.name] || { remaining: 0, total: 0, seen: 0 };
    }
  });
  return out;
}

function renderChecklistByLocation(){
  var tierRank = { mega:0, rare:1, uncommon:2, common:3 };
  var locs = buildLocationSummary();
  return locs.map(function(loc){
    var rows = loc.rows.slice().sort(function(a,b){
      if(!!a.confirmedDetail !== !!b.confirmedDetail) return a.confirmedDetail ? 1 : -1;
      if(tierRank[a.entry.tier]!==tierRank[b.entry.tier]) return tierRank[a.entry.tier]-tierRank[b.entry.tier];
      return a.entry.name<b.entry.name ? -1 : (a.entry.name>b.entry.name ? 1 : 0);
    }).map(function(row){
      var entry = row.entry, confirmedDetail = row.confirmedDetail;
      var tierCls = entry.tier==="mega"?"pill mega":(entry.tier==="rare"?"pill rare":"pill");
      if(confirmedDetail){
        var seenNote = confirmedDetail.firstSeenDate ? ' <span class="seen-note">Seen: '+formatOrdinalDate(confirmedDetail.firstSeenDate)+'</span>' : '';
        return '<li class="muted"><span class="struck">'+esc(entry.name)+'</span>'+(confirmedDetail.audio?' <span style="font-size:.75em">(heard)</span>':'')+seenNote+' <span class="'+tierCls+'" style="opacity:.6">'+entry.tier+'</span></li>';
      }
      var gateNote = entry.gate==="nocturnal" ? " &mdash; after dark only" : "";
      var priorSeen = LIFE_LIST_SNAPSHOT[entry.name] ? ' <span class="seen-note">Seen: '+formatOrdinalDate(LIFE_LIST_SNAPSHOT[entry.name])+'</span>' : '';
      return '<li><strong>'+esc(entry.name)+'</strong>'+gateNote+priorSeen+' <span class="'+tierCls+'">'+entry.tier+'</span></li>';
    }).join("");
    return '<div class="lifelist-group"><h4>'+esc(loc.name)+' &middot; '+loc.remaining+' remaining of '+loc.rows.length+'</h4><ul class="plain">'+rows+'</ul></div>';
  }).join("");
}

function attachPanelHandlers(){
  var closeBtn = document.getElementById("panelClose");
  if(closeBtn) closeBtn.addEventListener("click", function(){ state.sheet=null; render(); });
  var modeHide = document.getElementById("modeHide");
  var modeWalk = document.getElementById("modeWalk");
  if(modeHide) modeHide.addEventListener("click", function(){ state.watchMode="hide"; render(); });
  if(modeWalk) modeWalk.addEventListener("click", function(){ state.watchMode="walk"; render(); });
  var doSearchBtn = document.getElementById("doSearch");
  if(doSearchBtn) doSearchBtn.addEventListener("click", function(){
    state.sheet = null;
    startWatch("hide", CONFIG.hideSearch.minutes, 1);
  });
  root.querySelectorAll("[data-loop]").forEach(function(b){
    b.addEventListener("click", function(){
      var cfg = CONFIG.loop[b.getAttribute("data-loop")];
      state.sheet = null;
      startWatch("walk", cfg.minutes, cfg.bonus);
    });
  });
}

function attachTravelTabHandlers(){
  root.querySelectorAll("[data-travel]").forEach(function(b){ b.addEventListener("click", function(){ doTravel(b.getAttribute("data-travel")); }); });
  root.querySelectorAll("[data-zone]").forEach(function(b){ b.addEventListener("click", function(){ doChangeZone(b.getAttribute("data-zone")); }); });
  root.querySelectorAll("[data-site]").forEach(function(g){ g.addEventListener("click", function(){ doTravelToViaShortestRoute(g.getAttribute("data-site")); }); });
  var toggleTableBtn = document.getElementById("toggleTravelTable");
  if(toggleTableBtn) toggleTableBtn.addEventListener("click", function(){ state.travelTableOpen = !state.travelTableOpen; render(); });
  var toggleGuideBtn = document.getElementById("toggleSiteGuide");
  if(toggleGuideBtn) toggleGuideBtn.addEventListener("click", function(){ state.siteGuideOpen = !state.siteGuideOpen; render(); });
}

/* ---- Camp screen ---- */
function renderCamp(){
  var speciesCount = distinctConfirmedCount();
  var campSite = SITES[state.campSiteId || state.currentSite];
  /* Camp can now be made any time from 8pm, not just at the automatic
     midnight cutoff — headline reflects whichever actually happened. */
  var campMadeClock = (state.campFinishClock!=null ? state.campFinishClock : CONFIG.saturdayEnd+60) - 60;
  var headline = minuteOfDay(campMadeClock)===0
    ? "Midnight. The list stands at "+speciesCount+"."
    : "Camp made at "+fmtClock(campMadeClock).split(" ")[1]+". The list stands at "+speciesCount+".";
  root.innerHTML =
    '<div class="dossier">' +
      '<div class="dossier-head">' +
        '<div class="eyebrow">Overnight camp &middot; '+esc(campSite.name)+'</div>' +
        '<h1>'+headline+'</h1>' +
        '<p>Pitched where you finished. Camp takes an hour to sort before anyone can actually turn in.</p>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Standings, exact</h2>' +
        '<div class="lb-list">' + [{ name: state.teamName, tag:"Your team", count: speciesCount, key:"you", you:true }]
          .concat(RIVAL_DEFS.map(function(r){ return { name:r.name, tag:r.tag, count: state.rivals.counts[r.key], key:r.key }; }))
          .sort(function(a,b){ return b.count-a.count; })
          .map(function(r,i){
            var medal = i===0?" medal-1":(i===1?" medal-2":(i===2?" medal-3":""));
            return '<div class="lb-row'+medal+(r.you?" you":"")+'"><span class="rank">#'+(i+1)+'</span>'+avatarMarkup(r.name,r.key)+
              '<span class="name">'+esc(r.name)+(r.you?" (you)":"")+' <span class="muted" style="font-weight:400;font-size:.78rem;">&middot; '+esc(r.tag)+'</span></span>'+
              '<span class="count">'+r.count+'</span></div>';
          }).join("") +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>When do you wake?</h2>' +
        '<p class="muted" style="font-size:.85rem;margin-top:0">Earlier means less energy back, but Sunday always ends at 3:00pm regardless of when you wake. Sleeping in the tent tonight'+(state.forcedBadNight?" — and it's turned cold and wet.":".")+'</p>' +
        '<div class="tray" style="padding:0">' +
          wakeOptions().map(function(opt){
            var wake = fmtClock(opt.wakeClock).split(" ")[1];
            var prev = sleepEnergyPreview(opt.hours);
            /* Camping can now happen as early as 8pm with energy still
               near full (say, right after a tea break) — sleep genuinely
               can't add anything past 100, so say so plainly rather than
               showing a bare "+0 energy" that reads like a glitch. */
            var note;
            if(prev.goodGain<=0 && prev.badGain<=0){
              note = "already topped up" + (state.forcedBadNight ? " (cold night)" : "");
            } else if(state.forcedBadNight){
              note = "+"+prev.badGain+" energy (cold night)";
            } else if(prev.goodGain===prev.badGain){
              note = "+"+prev.goodGain+" energy";
            } else {
              note = "+"+prev.goodGain+" energy, or +"+prev.badGain+" if it turns cold";
            }
            return '<button class="sleep-btn" data-sleep="'+opt.wakeClock+'">Wake at '+wake+'<span class="mono energy-note">'+fmtDuration(opt.hours*60)+' sleep &middot; '+note+'</span></button>';
          }).join("") +
        '</div>' +
      '</div>' +
    '</div>';
  root.querySelectorAll("[data-sleep]").forEach(function(b){ b.addEventListener("click", function(){ chooseSleep(parseInt(b.getAttribute("data-sleep"),10)); }); });
}

/* ---- End screen ---- */
/* Everything confirmed this weekend, grouped by the site it was ticked at,
   richest site first — a quick "where did the list actually come from"
   view for the results screen, without needing to dig back into the
   Checklist tab. */
function renderEndLocationSummary(){
  var tierRank = { mega:0, rare:1, uncommon:2, common:3 };
  var bySite = {};
  Object.keys(state.confirmed).forEach(function(id){
    var c = state.confirmed[id];
    var loc = c.siteName || "Unknown";
    if(!bySite[loc]) bySite[loc] = [];
    bySite[loc].push(c);
  });
  var locNames = Object.keys(bySite).sort(function(a,b){ return bySite[b].length - bySite[a].length; });
  if(!locNames.length) return "<p class='muted'>Nothing confirmed this weekend.</p>";
  return locNames.map(function(loc){
    var rows = bySite[loc].slice().sort(function(a,b){
      if(tierRank[a.tier]!==tierRank[b.tier]) return tierRank[a.tier]-tierRank[b.tier];
      return a.name<b.name ? -1 : (a.name>b.name ? 1 : 0);
    }).map(function(c){
      var tierCls = c.tier==="mega"?"pill mega":(c.tier==="rare"?"pill rare":"pill");
      return '<li>'+esc(c.name)+(c.audio?' <span style="font-size:.75em">(heard)</span>':'')+' <span class="'+tierCls+'">'+c.tier+'</span></li>';
    }).join("");
    return '<div class="lifelist-group"><h4>'+esc(loc)+' &middot; '+bySite[loc].length+'</h4><ul class="plain">'+rows+'</ul></div>';
  }).join("");
}

function renderEnd(){
  var confirmedList = Object.keys(state.confirmed).map(function(k){ return state.confirmed[k]; });
  var score = distinctConfirmedCount();
  var prevBest = state.finalPrevBest;
  var isNewBest = state.finalIsNewBest;
  var tierRank = { mega:-1, rare:0, uncommon:1, common:2 };
  var rarest = confirmedList.slice().sort(function(a,b){ return tierRank[a.tier]-tierRank[b.tier]; }).slice(0,3);
  var rivalsFinal = [{ name: state.teamName, count: score, you:true }].concat(
    RIVAL_DEFS.map(function(r){ return { name: r.name, count: state.rivals.counts[r.key] }; })
  ).sort(function(a,b){ return b.count-a.count; });
  var rank = rivalsFinal.findIndex(function(r){ return r.you; }) + 1;

  var gotAwayHtml = state.gotAway.length ? state.gotAway.map(function(g){
    var whatItWas = g.speciesName ? ("Turned out to be a <strong>"+esc(g.speciesName)+"</strong>") : "Never identified";
    return "<li>A " + (g.audio? "call":"silhouette") + " at " + esc(g.siteName) + ", " + g.at + " &mdash; " + whatItWas + ".</li>";
  }).join("") : "<li class='muted'>Nothing left unresolved. A clean weekend.</li>";

  root.innerHTML =
    '<div class="dossier">' +
      '<div class="dossier-head">' +
        '<div class="eyebrow">Weekend over</div>' +
        '<h1>Final tally: '+score+' species</h1>' +
        '<p>'+esc(state.endReason)+'</p>' +
        '<p class="'+(isNewBest?"":"muted")+'" style="font-weight:'+(isNewBest?"700":"400")+'">'+(isNewBest ? '<span class="confetti"><i></i><i></i><i></i><i></i><i></i></span>'+(prevBest===null ? "First result banked &mdash; "+score+" is now your personal best." : "New personal best! Previous best was "+prevBest+".") : "Your personal best is "+prevBest+".")+'</p>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Weekend leaderboard</h2>' +
        '<div class="lb-list">' + rivalsFinal.map(function(r,i){
          var medal = i===0?" medal-1":(i===1?" medal-2":(i===2?" medal-3":""));
          return '<div class="lb-row'+medal+(r.you?" you":"")+'"><span class="rank">#'+(i+1)+'</span>'+avatarMarkup(r.name, r.you?"you":(RIVAL_DEFS.filter(function(rd){return rd.name===r.name;})[0]||{}).key)+
            '<span class="name">'+esc(r.name)+(r.you?" (you)":"")+'</span><span class="count">'+r.count+'</span></div>';
        }).join("") + '</div>' +
        '<div style="text-align:right;margin-top:12px;"><button class="ghost" id="playAgainTop" style="font-size:.78rem;padding:7px 14px;">Play again</button></div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Best three of the weekend</h2>' +
        (rarest.length ? '<ul class="plain">'+rarest.map(function(r){ var tc=r.tier==="mega"?"pill mega":(r.tier==="rare"?"pill rare":"pill"); return "<li>"+esc(r.name)+" &mdash; "+r.siteName+", "+r.at+' <span class="'+tc+'">'+r.tier+'</span></li>'; }).join("")+'</ul>' : "<p class='muted'>No list to show.</p>") +
      '</div>' +
      '<div class="card">' +
        '<h2>Where you found them</h2>' +
        renderEndLocationSummary() +
      '</div>' +
      '<div class="card">' +
        '<h2>The one that got away</h2>' +
        '<ul class="plain">'+gotAwayHtml+'</ul>' +
      '</div>' +
      '<button class="ghost block" id="viewFullChecklist">View full checklist, including what you missed</button>' +
      '<button class="primary block" id="playAgain">Play again</button>' +
    '</div>';
  document.getElementById("playAgain").addEventListener("click", function(){ state=null; regDraft=null; render(); });
  document.getElementById("playAgainTop").addEventListener("click", function(){ state=null; regDraft=null; render(); });
  document.getElementById("viewFullChecklist").addEventListener("click", function(){ state.endTab="checklist"; render(); });
}

/* Same Checklist tab used during play (by-rarity or by-location, with
   everything still outstanding shown alongside what was confirmed), just
   reachable from the results screen too, with a way back to the tally. */
function renderEndChecklist(){
  root.innerHTML =
    '<div class="tabpage" style="padding-top:16px;">' +
      '<div style="padding:0 16px;">' +
        '<button class="ghost" id="backToResults">&larr; Back to results</button>' +
      '</div>' +
    '</div>' +
    renderChecklistTab();
  var backBtn = document.getElementById("backToResults");
  if(backBtn) backBtn.addEventListener("click", function(){ state.endTab=null; render(); });
  var viewRarityBtn = document.getElementById("viewRarityBtn");
  var viewLocationBtn = document.getElementById("viewLocationBtn");
  if(viewRarityBtn) viewRarityBtn.addEventListener("click", function(){ state.checklistView="rarity"; render(); });
  if(viewLocationBtn) viewLocationBtn.addEventListener("click", function(){ state.checklistView="location"; render(); });
}

/* ============================== HOT SNAPSHOT (best-effort) ============================== */
function saveSnapshot(){
  try{
    if(window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function"){
      window.claude.hot.snapshot(function(){ return { state: state, regDraft: regDraft }; });
    }
  }catch(e){}
}

function boot(){
  var data = null;
  try{ if(window.claude && window.claude.hot && window.claude.hot.data) data = window.claude.hot.data; }catch(e){}
  if(data && data.state){ state = data.state; regDraft = data.regDraft || null; }
  render();
  try{
    if(window.claude && window.claude.hot){
      if(typeof window.claude.hot.snapshot === "function") window.claude.hot.snapshot(function(){ return { state: state, regDraft: regDraft }; });
      if(typeof window.claude.hot.ready === "function") window.claude.hot.ready();
    }
  }catch(e){}
}

boot();

})();
</script>

</body></html>
