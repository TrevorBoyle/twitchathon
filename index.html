<style>

  :root{
    --paper:#f2f4ec;
    --paper-2:#e6ebde;
    --card:#fbfcf7;
    --btn-bg:#ffffff;
    --ink:#242920;
    --ink-soft:#6b7161;
    --line:#d3dac6;
    --accent:#3f6b46;
    --accent-soft:#e3ecdf;
    --accent-2:#2f6f72;
    --accent-2-soft:#dce9ea;
    --good:#3f6b46;
    --warn:#9c7a1f;
    --warn-soft:#f6ecc7;
    --warn2:#c1692c;
    --bad:#a5402f;
    --bad-soft:#f3ded9;
    --coastal:#3f76a8;
    --coastal-soft:#dfe9f1;
    --coffee:#6b4226;
    --coffee-soft:#efe0d0;
    --skill:#7a5ba6;
    --skill-soft:#e8e0f0;
    --shadow:0 1px 0 rgba(36,41,32,0.08);
    --shadow-card:0 1px 2px rgba(36,41,32,0.06), 0 6px 16px -8px rgba(36,41,32,0.18);
    --shadow-pop:0 10px 28px -10px rgba(36,41,32,0.30);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12160f;
      --paper-2:#181d14;
      --card:#1c231a;
      --btn-bg:#232b1c;
      --ink:#eaf0e2;
      --ink-soft:#8fa085;
      --line:#2c3626;
      --accent:#7fd68f;
      --accent-soft:#1e2c1f;
      --accent-2:#e8a75c;
      --accent-2-soft:#3a2e1a;
      --good:#7fd68f;
      --warn:#e0c060;
      --warn-soft:#3a331a;
      --warn2:#e2a35e;
      --bad:#e08670;
      --bad-soft:#3a2420;
      --coastal:#6fa8d8;
      --coastal-soft:#1c2833;
      --coffee:#c9976a;
      --coffee-soft:#2e2016;
      --skill:#b79ce0;
      --skill-soft:#2a2436;
      --shadow:0 1px 0 rgba(0,0,0,0.45);
      --shadow-card:0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -8px rgba(0,0,0,0.55);
      --shadow-pop:0 14px 32px -10px rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12160f;
    --paper-2:#181d14;
    --card:#1c231a;
    --btn-bg:#232b1c;
    --ink:#eaf0e2;
    --ink-soft:#8fa085;
    --line:#2c3626;
    --accent:#7fd68f;
    --accent-soft:#1e2c1f;
    --accent-2:#e8a75c;
    --accent-2-soft:#3a2e1a;
    --good:#7fd68f;
    --warn:#e0c060;
    --warn-soft:#3a331a;
    --warn2:#e2a35e;
    --bad:#e08670;
    --bad-soft:#3a2420;
    --coastal:#6fa8d8;
    --coastal-soft:#1c2833;
    --coffee:#c9976a;
    --coffee-soft:#2e2016;
    --skill:#b79ce0;
    --skill-soft:#2a2436;
    --shadow:0 1px 0 rgba(0,0,0,0.45);
    --shadow-card:0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -8px rgba(0,0,0,0.55);
    --shadow-pop:0 14px 32px -10px rgba(0,0,0,0.65);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    margin:0;
    padding-inline:0;
  }
  #app{max-width:920px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

  h1,h2,h3{font-family:'JetBrains Mono',monospace;color:var(--ink);text-wrap:balance;margin:0;}
  a{color:var(--accent);}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-soft);}
  .serif-i{font-family:'JetBrains Mono',monospace;font-style:italic;}

  /* ---------- Registration ---------- */
  .dossier{padding:28px 18px 60px;display:flex;flex-direction:column;gap:26px;}
  .dossier-head{border-bottom:3px double var(--line);padding-bottom:18px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .dossier-head h1{font-size:2rem;font-weight:600;letter-spacing:-.01em;}
  .dossier-head p{color:var(--ink-soft);font-family:'JetBrains Mono',monospace;font-style:italic;font-size:1.02rem;margin-top:8px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px;box-shadow:var(--shadow-card);}
  .card h2{font-size:1.15rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:9px;}
  .card h2::before{content:"";display:inline-block;width:5px;height:1.05em;border-radius:3px;background:var(--accent);flex:none;}
  .card h2 .n{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:1px 8px;}

  input[type=text]{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-style:italic;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);width:100%;max-width:320px;}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .mapwrap{border:1px solid var(--line);border-radius:14px;background:var(--paper-2);padding:10px;margin-bottom:12px;box-shadow:var(--shadow-card);overflow:hidden;}
  .mapwrap svg{width:100%;height:auto;display:block;border-radius:8px;}
  .mapwrap svg line{cursor:default;}
  .mapwrap svg .mapsite{cursor:pointer;}
  .map-legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 2px 0;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--ink-soft);align-items:center;}
  .map-legend .dot{display:inline-block;border-radius:50%;margin-right:5px;vertical-align:middle;}
  @keyframes pulseRing{ 0%,100%{opacity:.25;} 50%{opacity:.75;} }
  .pulse-ring{ animation: pulseRing 1.8s ease-in-out infinite; transform-origin:center; }
  @keyframes entryIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes panelGrow{ from{opacity:0; transform:scaleY(.90) translateY(-6px);} to{opacity:1; transform:scaleY(1) translateY(0);} }
  .entry.reveal{ animation: entryIn .32s ease-out; }
  .anim-tray{display:flex;justify-content:center;padding-inline:16px;}
  .tblwrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);}
  th{font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid var(--ink-soft);}
  td.num,th.num{font-family:'JetBrains Mono',monospace;text-align:right;}

  .loadout-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .loadout-row:last-child{border-bottom:none;}
  .loadout-row .desc{font-size:.8rem;color:var(--ink-soft);}

  /* ---------- Shopping list: horizontal RPG-loadout cards ---------- */
  .shopcard{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .shopcard:last-child{border-bottom:none;}
  .shopcard .icon{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
  .shopcard .icon.optics{background:var(--coastal-soft);color:var(--coastal);}
  .shopcard .icon.food{background:var(--accent-2-soft);color:var(--accent-2);}
  .shopcard .icon.skill{background:var(--skill-soft);color:var(--skill);}
  .shopcard .body{flex:1 1 180px;min-width:0;}
  .shopcard .body strong{display:block;}
  .shopcard .body .desc{font-size:.8rem;color:var(--ink-soft);margin-top:2px;}
  .shopcard .ctrl{flex:0 1 auto;min-width:0;max-width:100%;margin-left:auto;}
  .radiogrp{display:flex;gap:6px;flex-wrap:wrap;max-width:100%;}
  .chip{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer;}
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--paper);}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:30px;height:30px;padding:0;border-radius:50%;}
  .budget-bar{position:sticky;bottom:0;background:var(--paper-2);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .budget-bar .amt{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;}
  .budget-bar .amt.over{color:var(--bad);}

  /* ---------- Buttons ---------- */
  button{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.85rem;border:1px solid var(--line);background:var(--btn-bg);color:var(--ink);border-radius:10px;padding:11px 10px;cursor:pointer;box-shadow:var(--shadow-card);transition:border-color .15s, transform .1s, box-shadow .15s, background-color .15s;}
  button:hover:not(:disabled){border-color:var(--accent);}
  button:active:not(:disabled){transform:translateY(1px);background-color:color-mix(in srgb, var(--btn-bg) 85%, var(--ink) 15%);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button:disabled{opacity:.38;cursor:not-allowed;}
  button.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);box-shadow:var(--shadow-pop);}
  button.warn{background:var(--accent-2);color:var(--paper);border-color:var(--accent-2);box-shadow:var(--shadow-pop);}
  button.ghost{background:var(--paper-2);box-shadow:none;}
  button.ghost:active:not(:disabled){background-color:color-mix(in srgb, var(--paper-2) 85%, var(--ink) 15%);}
  button.block{width:100%;}

  /* ---------- HUD ---------- */
  .hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper-2);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;}
  .hud-left{display:flex;flex-direction:column;gap:2px;}
  .hud .clock{font-family:'JetBrains Mono',monospace;font-size:1.35rem;font-weight:800;letter-spacing:-.01em;}
  .hud .site{font-family:'JetBrains Mono',monospace;font-style:italic;font-size:1rem;color:var(--accent);}
  .hud .site .loc-label{font-style:normal;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .hud-mid{display:flex;align-items:center;gap:10px;min-width:140px;flex:1;}
  .ebar-track{flex:1;height:9px;border-radius:5px;background:var(--line);overflow:hidden;min-width:70px;}
  .ebar-fill{height:100%;border-radius:5px;transition:width .25s ease;}
  .hud-right{display:flex;gap:16px;font-family:'JetBrains Mono',monospace;font-size:.82rem;align-items:center;}
  .hud-right .k{color:var(--ink-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;display:block;}
  .hud-right .val{display:block;font-weight:700;font-size:.92rem;color:var(--ink);margin-top:1px;}
  .hud-right .val.hero{font-size:1.25rem;font-weight:800;color:var(--accent);}
  .hud-right .val.warn{color:var(--bad);}

  .alerts{padding:8px 16px 0;display:flex;flex-wrap:wrap;gap:6px;}
  .onboard-hint{margin:10px 16px 0;padding:10px 12px;background:var(--accent-soft);border-radius:10px;font-size:.93rem;color:var(--ink);line-height:1.5;}
  .onboard-hint strong{color:var(--accent);}
  .rivalbar{padding:6px 16px;background:var(--paper-2);border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .rivalbar b{color:var(--ink);font-weight:700;}
  .rivalbar-label{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--ink-soft);}
  .rivalbar .pb{margin-left:auto;color:var(--accent);}

  .oddsbar{padding:7px 16px;background:var(--paper-2);border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;}
  .oddsbar.muted{font-style:italic;}
  .oddsbar-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline;row-gap:4px;}
  .oddsbar-line .oname{color:var(--ink);font-weight:700;}
  .oddsbar-line .opct{color:var(--ink);font-weight:700;margin-right:2px;}
  .oddsbar-mods{display:flex;flex-wrap:wrap;gap:6px;}
  .modchip{display:inline-block;border-radius:20px;padding:1px 8px;font-size:.76rem;white-space:nowrap;}
  .modchip.mod-pos{background:var(--accent-soft);color:var(--accent);}
  .modchip.mod-neg{background:var(--bad-soft);color:var(--bad);}
  .alert-pill{font-family:'JetBrains Mono',monospace;font-size:.78rem;background:var(--accent-2-soft);color:var(--accent-2);border-radius:20px;padding:3px 10px;}

  /* ---------- Log ---------- */
  .log{padding:14px 16px 8px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .entry{border-left:3px solid var(--line);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;}
  .entry.encounter{border-left-color:var(--accent);background:var(--accent-soft);}
  /* Rarity ramps up the volume on a genuinely new tick: common/uncommon
     stay at the base green, rare gets a heavier border and a deeper tint,
     mega goes all the way with a bold ring and bolder text. Falls back
     to the plain base look on browsers without color-mix() support. */
  .entry.encounter.tier-uncommon{border-left-width:4px;}
  .entry.encounter.tier-rare{border-left-width:5px;background:color-mix(in srgb, var(--accent) 28%, var(--accent-soft));}
  .entry.encounter.tier-rare .txt{font-weight:600;}
  .entry.encounter.tier-mega{border-left-width:6px;background:color-mix(in srgb, var(--accent) 48%, var(--accent-soft));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);}
  .entry.encounter.tier-mega .txt{font-weight:700;}
  .entry.event{border-left-color:var(--accent-2);background:var(--accent-2-soft);}
  .entry.system{border-left-color:var(--ink-soft);}
  .entry.newlocation{border-left-color:var(--coastal);}
  .entry.travel{border-left-color:var(--warn);background:var(--warn-soft);}
  .entry.tea{border-left-color:var(--coffee);background:var(--coffee-soft);}
  .entry .ts{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--ink-soft);display:block;margin-bottom:2px;}
  .entry .txt{font-family:'JetBrains Mono',monospace;font-size:.96rem;line-height:1.4;}
  .entry .tick-icon{color:var(--accent);margin-right:6px;}
  .entry.newlocation .tick-icon{color:var(--coastal);}

  /* ---------- Tray (action row, scrolls with the Activity tab) ---------- */
  .tray-wrap{padding-block:10px;}
  .tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;padding-inline:16px;}

  /* ---------- Inline action panel (Travel / Watch, in the Activity tab) ---------- */
  .inlinepanel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 16px 12px;padding:14px 16px;box-shadow:var(--shadow-card);transform-origin:top center;animation:panelGrow .22s ease-out;}
  .inlinepanel h3{font-size:1.02rem;margin-bottom:4px;}
  .inlinepanel .sub{color:var(--ink-soft);font-size:.83rem;margin-bottom:12px;}

  /* The "What was that?" panel is a real decision point, not just another
     expandable row, so it gets its own treatment: a warm border + glow
     that reads as "the thing to look at" without going full-overlay and
     blocking the rest of the screen (see the comment on
     renderAmbiguousPanel for why that was dropped). */
  .inlinepanel.ambiguous-panel{border-color:var(--warn);box-shadow:var(--shadow-pop), 0 0 0 1px var(--warn-soft);}
  .inlinepanel.ambiguous-panel h3{color:var(--warn);}

  /* ---------- Bottom tab bar ---------- */
  /* The tab row and the credit line stack as one column, pinned to the
     bottom of the screen — see renderTabBar() for why the credit line is
     duplicated here rather than shared with the static <footer>.
     Fixed rather than sticky: sticky only reaches the bottom of the
     viewport once #app's own content is tall enough to push it there, so
     on a short tab (Travel, or Activity/Checklist early in a game) it sat
     right after the content with dead space below instead of flush with
     the screen edge. Fixed pins it to the real viewport bottom regardless
     of how much content is above it, on both short and long (scrolled)
     tabs alike, with no dependence on #app's own height. left:50% +
     translateX(-50%) + width/max-width mirrors #app's own centering
     (max-width:920px margin:0 auto) so the bar still matches its width on
     wide screens instead of spanning the full browser window — done via
     transform rather than auto margins so it doesn't depend on the
     browser's over-constrained-width resolution for a fixed element. The
     bottom padding syncScrollPadding() sets on #app (root.style.
     paddingBottom, sized to this bar's measured height) keeps the last
     bit of real content from sitting underneath it now that it's out of
     normal flow. */
  .tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:920px;background:var(--paper-2);border-top:1px solid var(--line);border-radius:14px 14px 0 0;display:flex;flex-direction:column;z-index:20;box-shadow:0 -8px 20px -8px rgba(0,0,0,0.4),0 -1px 0 rgba(255,255,255,0.05) inset;}
  .tabbar-row{display:flex;}
  .tabbtn{flex:1;background:transparent;border:none;border-radius:0;border-top:2px solid transparent;padding:10px 4px 9px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.8rem;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .15s,color .15s,border-color .15s;}
  .tabbtn:first-child{border-radius:14px 0 0 0;}
  .tabbtn:last-child{border-radius:0 14px 0 0;}
  .tabbtn svg{display:block;}
  .tabbtn:hover:not(:disabled){border-color:transparent;}
  .tabbtn.tab-activity{border-top-color:color-mix(in srgb, var(--accent) 30%, transparent);color:color-mix(in srgb, var(--accent) 40%, var(--ink-soft));}
  .tabbtn.tab-travel{border-top-color:color-mix(in srgb, var(--accent-2) 30%, transparent);color:color-mix(in srgb, var(--accent-2) 40%, var(--ink-soft));}
  .tabbtn.tab-checklist{border-top-color:color-mix(in srgb, var(--skill) 30%, transparent);color:color-mix(in srgb, var(--skill) 40%, var(--ink-soft));}
  .tabbtn.tab-activity.active{color:var(--accent);border-top-color:var(--accent);background:var(--accent-soft);}
  .tabbtn.tab-travel.active{color:var(--accent-2);border-top-color:var(--accent-2);background:var(--accent-2-soft);}
  .tabbtn.tab-checklist.active{color:var(--skill);border-top-color:var(--skill);background:var(--skill-soft);}
  .tabbtn .tcount{display:block;font-family:'JetBrains Mono',monospace;font-size:.76rem;font-weight:400;color:var(--ink-soft);margin-top:1px;}
  .tabbtn.active .tcount{color:inherit;}

<script>
(function(){
"use strict";

/* ============================== THEME TOGGLE ==============================
   Independent of the game's own render cycle on purpose: the button lives
   outside #app so root.innerHTML rewrites never touch it, and it only ever
   flips an explicit data-theme stamp on <html>. With no stamp, the CSS falls
   back to prefers-color-scheme, same as before this existed. */
var THEME_KEY = "twitchathon_theme";

function storedTheme(){
  try{ return localStorage.getItem(THEME_KEY); }catch(e){ return null; }
}
function systemPrefersDark(){
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function effectiveTheme(){
  var stored = storedTheme();
  if(stored==="light" || stored==="dark") return stored;
  return systemPrefersDark() ? "dark" : "light";
}
/* Simple line-art sun (rays + ring) and a solid crescent moon — same pairing
   as most light/dark toggles, swapped in as inline SVG so they scale crisply
   and pick up the button's own color instead of relying on an emoji glyph
   rendering consistently across platforms. */
var ICON_SUN = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="1.5" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22.5"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1.5" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22.5" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
var ICON_MOON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M20.354 15.354A9 9 0 0 1 8.646 3.646 9.003 9.003 0 1 0 20.354 15.354z"></path></svg>';
function paintTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  var btn = document.getElementById("themeToggle");
  if(btn) btn.innerHTML = theme==="dark" ? ICON_SUN : ICON_MOON; /* shows the mode you'd switch TO */
}
function initTheme(){
  /* Visual only on load — an unvisited browser still follows the OS/system
     setting (and keeps following it if that changes) until the person
     actually clicks the toggle, at which point the choice is remembered. */
  paintTheme(effectiveTheme());
  var btn = document.getElementById("themeToggle");
  if(btn) btn.addEventListener("click", function(){
    var next = effectiveTheme()==="dark" ? "light" : "dark";
    paintTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  });

  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      if(!storedTheme()) paintTheme(effectiveTheme());
    });
  }
}
initTheme();

/* ============================== CONFIG ============================== */
/* Calibrated by simulation against the real detection/ID pipeline (not
   just the raw roll) so an hour of steady walking/watching at an average
   site lands close to: ~80% of that site's commons and ~60% of its
   uncommons found in the first hour, climbing to ~95%/~80% cumulative
   after a second hour, with a couple of rares turning up in the first
   hour and maybe one more in the second. There's no per-chunk cap on how
   many candidates get a look any more (see processChunk) — the numbers
   below are tuned assuming every remaining species gets an independent
   roll every 15 minutes. */
var ABUNDANCE = { common: 0.44, uncommon: 0.352, rare: 0.092, mega: 0.018 };

var CONFIG = {
  /* Per-hour drain (spendEnergy/spendSmartEnergy scale this down to whatever
     chunk of minutes actually elapsed). Tuned so a steady stretch of
     walking — the main way anyone actually searches for birds — burns
     through about 30 energy, a single tea break's worth, in roughly three
     hours: enough to land Fresh (70-100) right on the Flagging boundary at
     the three-hour mark, nudging a tea break every few hours rather than
     letting a team walk most of a day on one battery. Hide and drive scale
     with it, kept gentler since sitting and watching, or just driving,
     isn't as tiring as covering ground on foot. */
  energyRates: { drive: 3, hide: 4, walk: 10 },
  /* Walking gets very slightly more tiring per minute the longer a single
     committed loop runs — a 20-minute quick loop barely notices this, a
     full 2-hour extended loop pays a modest premium on top of the plain
     per-minute rate. Compounds per 15-minute chunk of continuous walking
     within the same loop (an ambiguous-chase pause doesn't reset it, since
     it's still the same walk; a tea break, snack, or moving on to a
     fresh loop does). Doesn't apply to "hide" mode — sitting and watching
     isn't the same kind of tiring as covering ground. */
  continuousWalkFatigue: 1.02,
  /* Consecutive tea breaks (no other action taken in between) restore less
     each time, decaying toward a floor — better to space them out. */
  teaBreak: { minutes: 25, restore: 30, restoreDecay: 0.6, restoreFloor: 10 },
  snackRestore: 20,
  snackPackSize: 5,
  snackPackCostBase: 20,
  binoculars: {
    none:    { cost: 0,  det: 0,  id: 0,  label: "Basic binoculars" },
    mid:     { cost: 30, det: 10, id: 5,  label: "Mid binoculars" },
    premium: { cost: 60, det: 20, id: 10, label: "Premium binoculars" }
  },
  scopeCostBase: 35,
  fieldGuideCostBase: 25,
  weatherproofCostBase: 30,
  parabolicMicCostBase: 30,
  /* Skills are no longer bought — each team is randomly handed exactly one
     for the weekend (see SKILL_DEFS), so the multipliers below still apply
     but there's no cost field on them any more. */
  youngEyes: { detBonus: 8, label: "Young eyes" },
  twitchersNose: { mult: 1.3, label: "Twitcher's nose" },
  ironConstitution: { mult: 0.8, label: "Iron constitution" },
  backroads: { mult: 0.85, label: "Backroads know-how" },
  budget: 100,
  energyTiers: [
    { min:70, max:100, name:"Fresh",             mult:1.00, tone:"good"  },
    { min:40, max:69,  name:"Flagging",          mult:0.90, tone:"warn"  },
    { min:15, max:39,  name:"Running on empty",  mult:0.75, tone:"warn2" },
    { min:0,  max:14,  name:"Cooked",            mult:0.60, tone:"bad"  }
  ],
  /* One shared curve regardless of site size — a small pocket site and a

     hour's uncommons back down to the ~80% cumulative target now that

  timeOnSiteDecay: 0.94,
  timeOnSiteFloor: 0.15,
  keepLooking: [ {bonus:0.15,flush:0.10}, {bonus:0.30,flush:0.18}, {bonus:0.45,flush:0.26} ],

  windows: ["Pre-dawn","Dawn chorus","Morning","Midday","Afternoon","Golden hour","Evening","Night"],
  activityMult: {

    water:     [0.7, 0.9, 1.0, 1.0, 1.0, 0.9, 0.7, 0.1],
    raptor:    [0.1, 0.4, 0.8, 1.3, 1.0, 0.5, 0.2, 0  ],
    nocturnal: [1.0, 0,   0,   0,   0,   0,   0.8, 1.2]

  saturdayEnd: 1170,
  deadline: 2070, /* Sunday, 3:00pm */

     out on their own simulated clock the whole time regardless. */
  campEarliestMinuteOfDay: 1200,
  callItAWeekendEarliestMinuteOfDay: 720,
  eventPool: ["rareAlert","localTip","dewyOptics","magpieSwoop","rivalEncounter","coldFront","roadworks","distantSilhouette","goldenLight","luckyBreak","secondWind","windPickup","gearFumble","chatWithLocal"],
  maxDegreeSoft: 5,
  travelMinPerPx: 0.40,
  travelFloor: 30,
  travelCeiling: 150,
  travelWobble: 0.15,
  hideSearch: { minutes: 30 },
  /* A wider spread of loop lengths than a flat short/long choice, so the
     walk on offer actually varies place to place — a quick 20-minute

     reserve, and everything in between. Longer loops cover more ground
     for a better bonus; shorter ones trade ground for speed. */
  loop: {
    quick:    { minutes: 20,  bonus: 0.82 },
    short:    { minutes: 45,  bonus: 1.00 },
    medium:   { minutes: 70,  bonus: 1.05 },
    long:     { minutes: 90,  bonus: 1.10 },
    extended: { minutes: 120, bonus: 1.20 }
  },

  loopOptionsBySize: {

    standard: ["short","long"],
    large:    ["extended"]

  siteLoopOptions: {
    mountmonster:     ["short","medium"],
    mcinwheel:        ["quick","short"],
    naracoortecaves:  ["medium","long"],
    bordertownwetlands:["quick","short","medium"],
    banghamcp:        ["medium","long"],
    penolacp:         ["short","medium","long"],
    lakeleake:        ["short","medium"],
    beachportlagoon:  ["quick","short"],
    padthawaycp:      ["medium","long","extended"],
    hackslagoon:      ["quick","short","long"],
    boollagoon:       ["quick","short","medium","extended"],
    mullingerswampcp: ["quick","short"]
  },
  /* Time-on-site threshold (minutes) past which the Travel tab starts
     pulsing — a nudge that the odds here have faded enough that moving on
     is probably worth it. Scaled by site size, since a big reserve stays
     worth working much longer than a small pocket site. */
  travelPulseMinutesBySize: { pocket: 45, standard: 75, large: 135 },
  confusingKeywords: ["Honeyeater","Thornbill","Weebill","Heathwren","Fairywren","Warbler","Whistler","Stint","Sandpiper","Snipe","Grasswren","Quail-thrush","Scrub-robin","Redthroat","Babbler","Grebe"],
  activityFeedLimit: 25,
  roadsideRaptor: { minMinutes: 45, maxChance: 0.32, idPenalty: 0.65 },

     HUD's modifier chips (built in oddsSnapshot) can read the same numbers
     instead of re-typing them as separate percentages — one source of
     truth for both the math and the display. */
  effects: {
    dewyMult: 0.85,
    magpieMult: 0.90,
    coldFrontMult: 2.5,
    mistWaterMult: 0.55,
    fieldGuideMult: 1.15,
    distancePenaltyMult: 0.7,
    weatherproofFloor: 0.95,
    parabolicMicDetectMult: 1.35,
    parabolicMicIdMult: 1.25,
    scopeRaptorIdMult: 1.15,
    goldenLightMult: 1.15,
    windPickupMult: 0.90,
    gearFumbleMult: 0.85,
    /* Not full dark, but not real light either — anything that isn't a
       nocturnal specialist (already tuned for this window) is harder to
       pin down by sight in the pre-dawn half-light. */
    preDawnNonNocturnalIdMult: 0.7
  }
};

/* The one skill each team is randomly handed at registration — see
   startGame(). Kept as a lookup so both the registration reveal and the

var SKILL_DEFS = [
  { key:"youngEyes", label:"Young eyes", desc:"+"+CONFIG.youngEyes.detBonus+" flat detection, stacking with binoculars" },
  { key:"twitchersNose", label:"Twitcher's nose", desc:"Rare and mega birds are "+Math.round((CONFIG.twitchersNose.mult-1)*100)+"% more likely to be picked up in the first place" },
  { key:"ironConstitution", label:"Iron constitution", desc:"Cuts energy drain from watching, walking and driving by "+Math.round((1-CONFIG.ironConstitution.mult)*100)+"%" },
  { key:"backroads", label:"Backroads know-how", desc:"Cuts every drive between sites by "+Math.round((1-CONFIG.backroads.mult)*100)+"%" }
];

/* ============================== DATA ============================== */
function sp(id,name,tier,group,idDiff,audio){ return {id:id,name:name,tier:tier,group:group,idDiff:idDiff,audio:!!audio}; }

var SITES = {

/* A deduplicated roster, one row per real species name (several site entries
   can share a name, e.g. Pacific Black Duck turns up at half the wetlands) —
   this is what the checklist is built from. */
function buildSpeciesRoster(){
  var byName = {}, order = [];
  FLAT_SPECIES.forEach(function(f){
    var spx = f.species;
    if(!byName[spx.name]){
      byName[spx.name] = { name:spx.name, tier:spx.tier, group:spx.group, audio:spx.audio, ids:[], sites:[], gate:null };
      order.push(spx.name);
    }
    var entry = byName[spx.name];
    entry.ids.push(spx.id);
    if(entry.sites.indexOf(f.label)===-1) entry.sites.push(f.label);
    if(NOCTURNAL_GATE_IDS[spx.id]) entry.gate = "nocturnal";
  });
  var tierRank = { mega:0, rare:1, uncommon:2, common:3 };
  return order.map(function(n){ return byName[n]; }).sort(function(a,b){
    if(tierRank[a.tier]!==tierRank[b.tier]) return tierRank[a.tier]-tierRank[b.tier];
    return a.name<b.name ? -1 : (a.name>b.name ? 1 : 0);
  });
}

/* "1st March, 2026" */
function formatOrdinalDate(iso){
  if(!iso) return "";
  var parts = iso.split("-");
  var y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1, day = parseInt(parts[2],10);
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var suffix = "th";
  if(day%10===1 && day!==11) suffix = "st";
  else if(day%10===2 && day!==12) suffix = "nd";
  else if(day%10===3 && day!==13) suffix = "rd";
  return day+suffix+" "+months[m]+", "+y;
}
